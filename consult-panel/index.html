function createPlans(p,form,source){const selected=[...form.querySelectorAll('input[name="reviewItem"]:checked')].map(x=>p.abnormal[Number(x.value)]);const date=form.elements.reviewDate.value;const notice=form.elements.assistant.value==='yes'?'未通知':'无需通知';selected.forEach(item=>p.plans.push({id:'P'+Date.now()+Math.random().toString(36).slice(2,5),item,date,state:'待复查',source,notice,created:stamp()}));return selected.length}
function submitForm(form){const p=patient(),mode=state.form;const data=new FormData(form);if(mode==='inform'){const result=data.get('result');if(result==='已告知'){p.informed=TODAY;p.status=p.abnormal.length?'tracking':'closed';p.followDue=p.abnormal.length?datePlus(TODAY,p.category==='A'?10:p.category==='B'?30:90):null;if(!p.abnormal.length)p.closedDate=TODAY;const count=createPlans(p,form,'告知时设置');record(p,'完成报告告知'+(count?'，生成 '+count+' 条异常复查任务':'')+(p.status==='closed'?'，报告无异常自动跟踪结束':''));}else record(p,'告知尝试：'+result+(data.get('note')?'；'+data.get('note'):''));}

if(mode==='refer'){p.status='referred';p.referral={date:TODAY,hospital:String(data.get('hospital')),department:String(data.get('department')),reason:String(data.get('note'))};record(p,'转诊至'+p.referral.hospital+' '+p.referral.department);}
if(mode==='close'){p.status='closed';p.closedDate=String(data.get('endDate'));record(p,'跟踪结束：'+data.get('reason')+(data.get('note')?'；'+data.get('note'):''));}
if(mode==='match'||mode==='match-indicators'){const plan=p.plans.find(x=>x.id===state.selectedPlan);if(mode==='match'&&!data.get('resultRecord')){notify('请选择关联记录');return}if(mode==='match'){plan.actual=String(data.get('resultRecord'));plan.state='已复查'}plan.matched=data.getAll('matched');record(p,(mode==='match'?'确认复查结果':'调整指标对应')+'：'+plan.item);}
if(mode==='cancel-plan'){const plan=p.plans.find(x=>x.id===state.selectedPlan);plan.state='已取消';plan.cancelReason=String(data.get('reason'));plan.notice='-';record(p,'取消异常复查任务：'+plan.item+'；原因：'+plan.cancelReason);}

function reviewReminder(p){
  if(p.status==='closed')return '';
  const pending=p.plans.filter(plan=>plan.state==='待复查').sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id)));
  if(!pending.length)return '';
  const first=pending[0];
  const names=[...new Set(pending.map(plan=>plan.item))].join('、');
  const noticeCount=pending.filter(plan=>plan.notice==='未通知').length;
  return '<button type="button" class="tip review-tip" data-action="review-reminder" data-plan="'+esc(first.id)+'"><span class="tip-icon '+(first.date<TODAY?'warn':'')+'">复</span><span><strong>'+pending.length+'项待复查：'+esc(names)+'</strong><span class="tip-sub">最早应复查 '+esc(first.date)+(noticeCount?' · '+noticeCount+'项待医助通知':'')+'</span></span><span class="arrow">›</span></button>';
}

document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action==='profile'){event.stopPropagation();state.view='profile';state.drawer=false;state.profileTab='portrait';render();return}if(action==='profile-back'){event.stopPropagation();state.view='panel';render();return}if(action.startsWith('profile-')){event.stopPropagation();state.profileTab=action.slice(8);render();return}if(action.startsWith('toggle-')){event.stopPropagation();state.pathOpen[action.slice(7)]=!state.pathOpen[action.slice(7)];renderPanel();return}if(action==='path-item'){event.stopPropagation();notify('该管理路径为演示入口');return}if(action==='zoom'){event.stopPropagation();state.zoomed=!state.zoomed;$('.shell').classList.toggle('zoomed',state.zoomed);el.innerHTML=state.zoomed?'<svg viewBox="0 0 20 20"><circle cx="8" cy="8" r="5"/><path d="m12 12 5 5M5 8h6"/></svg>':'<svg viewBox="0 0 20 20"><circle cx="8" cy="8" r="5"/><path d="m12 12 5 5M8 5v6M5 8h6"/></svg>';return}if(action==='minimize'||action==='close-window'){event.stopPropagation();$('.shell').classList.toggle('minimized');return}if(action==='maximize'){event.stopPropagation();$('.shell').classList.toggle('maximized');return}},true);
$('#opacity-root').addEventListener('mouseleave',()=>{if(state.opacityOpen){state.opacityOpen=false;showOpacity()}});
document.addEventListener('pointerover',event=>{if(state.opacityOpen&&!event.target.closest('#opacity-root,#profile-opacity-root,[data-action="opacity"]')){state.opacityOpen=false;showOpacity()}});
const localRenderDrawer=renderDrawer;
let resetConsultRecords=false;
document.addEventListener('click',event=>{if(event.target.id==='reset-confirm')resetConsultRecords=true},true);
renderDrawer=function(){
  if(state.drawerKind!=='exam')return localRenderDrawer();
  const expanded=state.drawer&&state.view==='panel';
  $('.shell').classList.toggle('expanded',expanded);
  if(!expanded){$('.shell').classList.remove('processing');$('#drawer-root').replaceChildren();return}
  const p=patient();
  let frame=$('#backend-detail-frame');
  if(!frame||frame.dataset.patient!==p.id){
    $('#drawer-root').innerHTML='<iframe id="backend-detail-frame" class="backend-detail-frame" title="'+esc(p.name)+'的体检异常详情" src="consult-detail.html?consultEmbed=1"></iframe>';
    frame=$('#backend-detail-frame');frame.dataset.patient=p.id;
    frame.addEventListener('load',()=>frame.contentWindow.postMessage({type:'consult-open',patient:patient(),tab:state.tab,planId:state.selectedPlan,reset:resetConsultRecords},'*'));
  }else frame.contentWindow.postMessage({type:'consult-open',patient:p,tab:state.tab,planId:state.selectedPlan,reset:resetConsultRecords},'*');
};
window.addEventListener('message',event=>{
  const frame=$('#backend-detail-frame');
  if(event.source!==frame?.contentWindow)return;
  if(event.data?.type==='consult-workflow'){$('.shell').classList.toggle('processing',!!event.data.open);return}
  if(event.data?.type==='consult-close'){state.drawer=false;renderDrawer();return}
  if(event.data?.type!=='consult-sync')return;
  const p=patients.find(entry=>entry.id===event.data.patientId);
  if(!p)return;
  resetConsultRecords=false;
  Object.assign(p,event.data.changes);save();
  if(state.view==='panel'&&state.patientId===p.id){const scroll=$('#rail-content').scrollTop;renderPanel();$('#rail-content').scrollTop=scroll}
});
render();
</script>
<script src="nonexam.js"></script>
<script src="nonexam-reference.js"></script>
<script src="followup.js"></script>
</body>
</html>
