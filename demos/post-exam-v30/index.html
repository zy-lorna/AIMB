    ];
    record.v34VisitData=true;
  });
}
function upgradeV35(){
  const normalizeGroup=item=>({血糖:'生化',血脂:'生化',影像检查:'B超'})[item.group]||item.group;
  db.records.filter(record=>record.notify).forEach(record=>{
    if(!record.reviewVisits?.length){
      const reviewDate=record.closedDate||((addDays(record.notify.date,3)>TODAY)?TODAY:addDays(record.notify.date,3));
      const items=record.items.filter(item=>item.category).slice(0,5).map(item=>({itemId:item.id,name:item.name,group:normalizeGroup(item),value:item.value,unit:item.unit,reference:item.reference,abnormal:true}));
      if(items.length)record.reviewVisits=[{id:`V35-REVIEW-${record.id}`,date:reviewDate+' 10:26:18',diagnosis:'体检异常复诊，结合复查结果继续随访。',items}];
    }
  });
  db.records.filter(record=>record.status==='closed'&&!record.normal).forEach(record=>{
    if(record.v35ClosedHistory)return;
    record.followDate??=addDays(record.notify.date,1);record.firstFollowDate??=record.followDate;record.followNote||='已电话确认复查安排并持续跟踪。';
    const recallId=`RC-V35-${record.id}`;if(!db.recalls.some(item=>item.id===recallId))db.recalls.push({id:recallId,recordId:record.id,groupId:record.groups[0]?.id||'',date:record.followDate,reviewDate:record.groups[0]?.date||record.followDate,assistant:'陈医助',status:'已通知',result:'已通知',note:'患者已知晓复查安排',notifiedDate:record.followDate});
    if(!record.referral)record.referral={date:addDays(record.notify.date,2),hospital:'某某区人民医院',department:'全科医学科',status:'已就诊',currentDiagnosis:'体检异常待评估',source:'主动转诊',reason:'体检异常',type:'上转',note:'建议进一步评估',appointmentDate:addDays(record.notify.date,3)};
    if(!record.referralVisits?.length)record.referralVisits=[{id:`V35-VISIT-${record.id}`,date:(record.referral.appointmentDate||record.referral.date)+' 09:16:20',institution:'某某区人民医院',doctor:'徐医生',bloodPressure:'126/76 mmHg',complaint:'体检异常复诊',presentHistory:'体检发现异常，按预约到院进一步评估。',pastHistory:'无特殊。',physicalExam:'一般情况可。',diagnosis:'体检异常待随访',medications:[],exams:[{name:'生化',abnormalCount:2}]}];
    record.v35ClosedHistory=true;
  });
}
function upgradeV36(){
  db.records.filter(record=>record.status==='closed'&&record.referral).forEach(record=>{
    if(record.referral.date>TODAY)record.referral.date=record.closedDate&&record.closedDate<=TODAY?record.closedDate:TODAY;
    record.referralVisits??=[];
    const visible=record.referralVisits.some(visit=>!visit.medicationOnly&&visit.date.slice(0,10)>=record.referral.date&&visit.date.slice(0,10)<=TODAY);
    if(visible)return;
    const visitDate=record.closedDate&&record.closedDate>=record.referral.date&&record.closedDate<=TODAY?record.closedDate:record.referral.date;
    record.referralVisits.push({id:`V36-VISIT-${record.id}`,date:visitDate+' 08:37:59',institution:record.referral.hospital||'某某区人民医院',doctor:'徐文婷',bloodPressure:'118/70 mmHg',complaint:'体检异常复诊，按转诊安排进一步评估',presentHistory:'体检发现异常，已完成持续跟踪并按预约到院复诊。',pastHistory:'糖尿病、高脂血症病史，否认食物及药物过敏史。',physicalExam:'神志清，心肺听诊未见明显异常，双下肢无水肿。',diagnosis:'体检异常待随访',medications:[{name:'阿托伐他汀钙片',frequency:'每天晚上一次',dose:'1',doseUnit:'片',dispensed:'2',dispensedUnit:'盒'}],exams:[{name:'生化',abnormalCount:2},{name:'血常规',abnormalCount:1}]});
  });
}
function openDetail(id,detailTab=null){const record=findRecord(id);if(record.status==='pending'&&state.page==='tracking'){openInform(id);return;}stopRecordingPlayback();hideSuggestion();state.drawer={type:'detail',id,detailTab:detailTab||detailTabsList(record)[0][0]};detailDrawer();}
function visitExamPreview(button){const record=findRecord(button.dataset.id);const visit=record.referralVisits?.find(entry=>entry.id===button.dataset.visit);const exam=visit?.exams?.find(entry=>entry.name===button.dataset.exam);if(!exam)return;const groupName=item=>({血糖:'生化',血脂:'生化',影像检查:'B超'})[item.group]||item.group;let items=record.items.filter(item=>groupName(item)===exam.name);if(!items.length)items=[{name:exam.name,value:'未获取指标明细',unit:'',reference:'—',category:''}];modal('检验检查原报告',`<h3>${escapeHTML(exam.name)}</h3><p>就诊日期：${escapeHTML(visit.date)}</p><div class="table-wrap" style="padding:0"><table class="abnormal-table"><thead><tr><th>指标名称</th><th>结果</th><th>正常范围</th><th>类别</th></tr></thead><tbody>${items.map(item=>`<tr class="${item.category?'abnormal-preview':''}"><td>${escapeHTML(item.name)}</td><td class="${item.category?'red-text':''}">${escapeHTML(item.value)} ${escapeHTML(item.unit||'')}</td><td>${escapeHTML(item.reference||'—')}</td><td>${item.category?textBadge(item.category+'类',item.category):'未见异常'}</td></tr>`).join('')}</tbody></table></div>`,null,true);}

document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;
  if(action==='population-category'){state.filters.category=state.filters.category===button.dataset.category?'':button.dataset.category;state.pageNumber=1;render();}
  if(action==='inform-tab'){captureInform();stopRecordingPlayback();state.drawer.detailTab=button.dataset.tab;informDrawer();}
  if(action==='recall-call')callModal(button.dataset.recall,'recall');
  if(action==='review-preview'){event.preventDefault();event.stopPropagation();openReviewPreview(button.dataset.id,button.dataset.visit,button.dataset.group);}
  if(action==='patient-label-remove'){const record=getReferenceRecord(button.dataset.id);const labels=[...(record.patientLabels||['责任患者','体检标签（演示）'])];labels.splice(Number(button.dataset.index),1);savePatientLabels(record.id,labels);render();}
  if(action==='patient-label-add'){state.tagEditor=button.dataset.id;render();document.getElementById('patient-label-input')?.focus();}
  if(action==='patient-label-cancel'){state.tagEditor=null;render();}
  if(action==='follow-cancel'&&state.drawer?.type==='follow'){state.drawer={type:'detail',id:state.drawer.id,detailTab:state.drawer.detailTab||'report'};detailDrawer();}
  if(action==='configure-assistant')openAssistantConfig();
  if(action==='assistant-add-show'){const row=document.getElementById('assistant-new-row');row.hidden=false;row.querySelector('input')?.focus();}
  if(action==='assistant-add-cancel'){const row=document.getElementById('assistant-new-row');row.hidden=true;row.querySelector('input').value='';document.getElementById('form-error').replaceChildren();}
  if(action==='assistant-add-confirm')addAssistantFromInput();
  if(action==='assistant-default'){const index=Number(button.dataset.index);const [assistant]=state.drawer.tempAssistants.splice(index,1);state.drawer.tempAssistants.unshift(assistant);renderAssistantConfig();}
  if(action==='assistant-remove'){state.drawer.tempAssistants.splice(Number(button.dataset.index),1);renderAssistantConfig();}
  if(action==='assistant-config-save')saveAssistantConfig();
  if(action==='toggle-review-project'){const items=document.getElementById(button.getAttribute('aria-controls'));const expanded=button.getAttribute('aria-expanded')==='true';button.setAttribute('aria-expanded',String(!expanded));button.title=(expanded?'展开':'收起')+button.closest('.review-project-head').querySelector('strong').textContent+'异常指标';if(items)items.hidden=expanded;}
  if(action==='unselect-review-item'&&state.drawer?.draft?.groups){event.preventDefault();event.stopPropagation();const index=Number(button.dataset.index);const group=state.drawer.draft.groups[index];group.items=group.items.filter(id=>id!==button.dataset.item);refreshReviewPlanDom();}
  if(action==='plan-review-preview'){event.preventDefault();event.stopPropagation();openPlanReviewPreview(button);}
  if(action==='visit-exam-preview')visitExamPreview(button);
});
document.addEventListener('change',event=>{const target=event.target;if(target.id==='referral-hospital'){const department=document.getElementById('referral-dept');department.disabled=!target.value;department.value='';department.querySelector('option').textContent=target.value?'请选择':'请先选择转诊医院';}if(target.name==='end-reason'){const field=document.getElementById('end-other-field');if(field)field.hidden=target.value!=='其他';}});
document.addEventListener('mouseout',event=>{const picker=event.target.closest?.('details.multi-select');if(!picker?.open||picker.contains(event.relatedTarget))return;picker.open=false;picker.querySelectorAll('.review-project-toggle[aria-expanded="true"]').forEach(toggle=>{toggle.setAttribute('aria-expanded','false');toggle.title=toggle.title.replace('收起','展开');const items=document.getElementById(toggle.getAttribute('aria-controls'));if(items)items.hidden=true;});});
document.addEventListener('click',event=>{const button=event.target.closest?.('[data-action="detail"][data-detail-tab]');if(!button)return;event.preventDefault();event.stopImmediatePropagation();openDetail(button.dataset.id,button.dataset.detailTab);},true);
document.addEventListener('submit',event=>{
  if(event.target.id==='stats-filters'){event.preventDefault();const data=new FormData(event.target);state.statsFilters={year:data.get('year'),institution:data.get('institution'),doctor:data.get('doctor')};render();}
  if(event.target.id==='patient-label-form'){event.preventDefault();const label=document.getElementById('patient-label-input').value.trim();const record=getReferenceRecord(state.tagEditor);const labels=record.patientLabels||['责任患者','体检标签（演示）'];if(!label||label.length>20){toast('请输入1–20字的标签');return;}if(labels.includes(label)){toast('该标签已存在');return;}savePatientLabels(record.id,[...labels,label]);state.tagEditor=null;render();}
});

upgradeReferenceData();
enrichRoundTwo();
upgradeV30History();
upgradeV31();
upgradeV32();
upgradeV33();
upgradeV34();
upgradeV35();
upgradeV36();
persist();

render();
</script>
