const ICONS={home:'<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>',chart:'<path d="M4 20V4m0 16h17M8 16v-5m5 5V7m5 9v-8"/>',heart:'<path d="M20 5c-3-3-6-1-8 1C10 4 7 2 4 5c-4 5 4 11 8 14 4-3 12-9 8-14Z"/><path d="M3 11h5l2-3 3 6 2-3h6"/>',user:'<circle cx="12" cy="7" r="3"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/>',file:'<path d="M5 3h10l4 4v14H5Z"/><path d="M14 3v5h5M8 12h8m-8 4h6"/>',phone:'<path d="m6 3 4 5-3 3c2 3 3 4 6 6l3-3 5 4c-1 3-3 4-6 3C8 19 3 14 2 7c0-3 1-4 4-4Z"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="3"/><circle cx="16" cy="17" r="3"/>',down:'<path d="m5 9 7 7 7-7"/>',export:'<path d="M12 3v12m-4-4 4 4 4-4M4 15v6h16v-6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/>',check:'<circle cx="12" cy="12" r="9"/><path d="m7 12 3 3 7-7"/>',empty:'<path d="M4 8h16v13H4ZM8 8V3h8v5M8 13h8m-8 4h5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',shield:'<path d="m12 2 9 4v7c0 5-9 9-9 9s-9-4-9-9V6Z"/><path d="m8 12 3 3 5-6"/>',trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6m5 4v7m4-7v7"/>'};
function icon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.file}</svg>`;}

const STORAGE='post-exam-v30-working-copy-20261015-v1';
const STATE_LABELS={pending:'待告知',tracking:'已告知待跟踪',following:'持续跟踪',referred:'已转诊',closed:'跟踪结束'};
const navs=[['population','体检人群'],['tracking','检后追踪'],['review','异常复查'],['recall','召回通知'],['stats','检后统计']];
const state={page:'tracking',tab:'pending',populationTab:'examined',pageNumber:1,pageSize:10,filters:{category:'',keyword:'',start:'2026-01-01',end:'2026-09-27',dueStart:'',dueEnd:'',reportStart:'',reportEnd:'',reviewStart:'',reviewEnd:'',planStatus:'',reviewStatus:'',notifyStatus:''},drawer:null,originFocus:null};
const names=['王某荣','马某英','孙某华','周某兰','李某康','陈某芳','赵某民','吴某梅','郑某平','徐某丽','许某良','蒋某珍','沈某祥','何某华','冯某清','朱某琴','秦某军','尤某花','杨某新','顾某香','梁某云','杜某祥','姚某芬','林某伟','宋某兰','唐某春','金某福','董某云'];
function abnormalItems(category,normal,index){if(normal)return [{id:'normal',group:'体检项目',name:'各项检验检查',value:'未见异常',unit:'',category:'',reference:'无异常提示',reviewed:false}];const base=[{id:'glu',group:'血糖',name:'空腹血糖',value:category==='A'?'16.8':'8.2',unit:'mmol/L',category:category==='A'?'A':'B',reference:'3.9~6.11',reviewed:false},{id:'lipid',group:'血脂',name:'低密度脂蛋白胆固醇',value:'3.9',unit:'mmol/L',category:'C',reference:'0.3~3.40',reviewed:index%3===0},{id:'us',group:'影像检查',name:'腹部超声',value:'肝囊肿直径8cm',unit:'',category:'B',reference:'—',reviewed:false}];if(category==='C')return [{...base[1],reviewed:index%3===0},{id:'weight',group:'一般检查',name:'体质指数',value:'26.1',unit:'kg/m²',category:'C',reference:'18~24',reviewed:false}];return index%2===0?base:base.slice(0,2);}
function addDays(date,days){const parsed=new Date(date+'T12:00:00Z');parsed.setUTCDate(parsed.getUTCDate()+days);return parsed.toISOString().slice(0,10);}
function addMonths(date,months){const parsed=new Date(date+'T12:00:00Z');const day=parsed.getUTCDate();parsed.setUTCDate(1);parsed.setUTCMonth(parsed.getUTCMonth()+months);const lastDay=new Date(Date.UTC(parsed.getUTCFullYear(),parsed.getUTCMonth()+1,0)).getUTCDate();parsed.setUTCDate(Math.min(day,lastDay));return parsed.toISOString().slice(0,10);}
function seed(){const records=names.map((name,index)=>{const statuses=['pending','pending','pending','pending','pending','pending','pending','pending','pending','pending','pending','pending','tracking','tracking','tracking','tracking','following','following','following','referred','referred','closed','closed','closed','closed','closed','tracking','following'];const category=['A','B','C','B','B','C','B','C','A','B','C','B'][index%12];const normal=[7,22,25].includes(index);const exam=addDays('2026-09-02',index%24);const report=addDays(exam,2);const status=statuses[index];const items=abnormalItems(category,normal,index);const record={id:'TJ2026'+String(index+1).padStart(4,'0'),name,sex:index%2?'女':'男',age:62+index%16,category:normal?'C':category,normal,exam,report,due:category==='A'?addDays(report,1):addDays(report,15),status,institution:'某某社区卫生服务中心',doctor:'金医生',assistant:'陈医助',package:['城乡体检','企退体检','灵活就业体检'][index%3],phone:'159****'+String(8011+index),identity:'3301**********'+String(1021+index),items,confirmed:status!=='pending',correctionReason:'',originalCategory:normal?'C':category,notify:null,groups:[],history:[{date:report+' 09:00',text:'同步总检报告，生成 V2.1 检后任务',actor:'系统'}],calls:[],closedDate:null};if(status!=='pending'){record.notify={date:addDays(report,1),method:'电话告知',target:'本人',result:'已告知',note:'已说明体检报告及后续安排'};record.followDue=addDays(record.notify.date,category==='A'?10:category==='B'?30:90);record.history.push({date:record.notify.date+' 10:30',text:'完成分类确认及结果告知',actor:'金医生'});if(!normal)record.groups=[{id:'g'+index,items:items.slice(0,1).map(item=>item.id),date:index===16?'2026-09-27':addDays(TODAY,index%5+2),assistant:'陈医助',lead:1}];}if(status==='following'){record.followDate=addDays(record.notify.date,2);record.history.push({date:record.followDate+' 14:15',text:'设置持续跟踪及复查计划',actor:'金医生'});}if(status==='referred'){record.referral={date:addDays(record.notify.date,2),hospital:'某某区人民医院',department:'全科医学科',reason:'体检异常，建议进一步评估',note:'演示转诊单，未对接外部系统'};record.history.push({date:record.referral.date+' 11:20',text:'保存转诊单',actor:'金医生'});}if(status==='closed'){record.closedDate=addDays(record.notify.date,normal?0:4);record.end={date:record.closedDate,method:'电话跟踪',reason:normal?'无需跟踪':'复查正常',note:normal?'体检报告未见异常':'演示跟踪结论'};record.history.push({date:record.closedDate+' 15:00',text:normal?'无异常报告告知后自动结束':'完成跟踪结束',actor:normal?'系统':'金医生'});}return record;});return {records,recalls:records.filter(record=>['following','tracking'].includes(record.status)).flatMap(record=>record.groups.map(group=>({id:'RC'+record.id+group.id,recordId:record.id,groupId:group.id,date:addDays(group.date,-group.lead),reviewDate:group.date,assistant:group.assistant,status:'未通知',result:'',note:'',notifiedDate:''}))),unexamined:[{name:'钱某娟',sex:'女',age:67,phone:'138****6210'},{name:'邹某良',sex:'男',age:72,phone:'137****0912'},{name:'蒋某莲',sex:'女',age:65,phone:'135****2819'},{name:'魏某康',sex:'男',age:70,phone:'139****9002'}]};}
let db;try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');db=saved&&Array.isArray(saved.records)&&Array.isArray(saved.recalls)?saved:seed();}catch{db=seed();}
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(db));}catch{toast('当前浏览器无法保存，操作仍在本次演示中生效');}}
function escapeHTML(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
function categoryBadge(record){return `<span class="badge ${record.category}">${record.category}类${record.normal?' · 未见异常':''}</span>`;}
function statusBadge(status){return `<span class="badge ${status}">${STATE_LABELS[status]||status}</span>`;}
function textBadge(text,kind='neutral'){return `<span class="badge ${kind}">${escapeHTML(text)}</span>`;}
function findRecord(id){return db.records.find(record=>record.id===id);}
function log(record,text,actor='金医生',date=TODAY+' '+new Date().toTimeString().slice(0,5)){record.history.push({date,text,actor});}
function toast(message){document.getElementById('toast-root').innerHTML=`<div class="toast" role="status">${icon('check')}${escapeHTML(message)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>document.getElementById('toast-root').replaceChildren(),3200);}
function renderNav(){document.getElementById('brandmark').innerHTML=icon('heart');document.getElementById('header-help').innerHTML=icon('info');document.getElementById('sidebar').innerHTML=`<div class="navitem">${icon('home')}首页</div><div class="navitem">${icon('chart')}数据统计</div><div class="navitem">${icon('file')}诊前采集</div><div class="navgroup">${icon('file')}诊后管理<span class="chevron">⌃</span></div><div class="navitem sub">接诊回顾</div><div class="navitem sub">诊后任务</div><div class="navgroup">${icon('user')}患者管理<span class="chevron">⌃</span></div><div class="navitem sub">待管人群</div><div class="navitem sub">注册人群</div><div class="navitem sub">失管人群</div><div class="navitem">${icon('heart')}随访管理</div><div class="navitem">${icon('clock')}异常监测</div><div class="navgroup">${icon('file')}体检管理<span class="chevron">⌃</span></div>${navs.map(([page,label])=>`<button class="navitem sub ${state.page===page?'active':''}" data-action="nav" data-page="${page}">${label}</button>`).join('')}<div class="navitem">${icon('phone')}协同管理</div><div class="navitem">${icon('settings')}设备管理</div><div class="navfooter">V3.0 工作副本 · 虚构演示数据<br>历史五色数据不在本 Demo 改动<br><br><button data-action="about">原型说明</button> <button data-action="reset-confirm">重置演示</button></div>`;}
function taskDates(record){if(state.tab==='following')return activeReviewGroups(record).map(group=>group.date);if(state.tab==='referred')return [record.referral?.date||''];if(state.tab==='closed')return [record.closedDate||''];if(state.tab==='tracking')return [record.followDue||''];return [record.due];}
function taskDateLabel(){return {pending:'告知期限',tracking:'跟踪期限',following:'应复查日期',referred:'转诊日期',closed:'末次跟踪日期'}[state.tab];}
function filteredRecords(filters=state.filters){return db.records.filter(record=>(!filters.category||record.category===filters.category)&&(!filters.keyword||[record.name,record.identity,record.phone,record.id].some(value=>value.includes(filters.keyword)))&&(!filters.start||record.exam>=filters.start)&&(!filters.end||record.exam<=filters.end)&&((!filters.dueStart&&!filters.dueEnd)||taskDates(record).some(date=>(!filters.dueStart||date>=filters.dueStart)&&(!filters.dueEnd||date<=filters.dueEnd)))&&(!filters.reportStart||record.report>=filters.reportStart)&&(!filters.reportEnd||record.report<=filters.reportEnd)&&(!filters.reviewStatus||reviewStatus(record)===filters.reviewStatus));}
function reviewStatus(record){const picked=record.groups.flatMap(group=>group.items);if(!picked.length)return '--';const completed=picked.filter(id=>itemHasReview(record,id)).length;return completed===picked.length?'已复查':completed?'已复查（部分）':'未复查';}
function filteredRecalls(){const ids=new Set(filteredRecords().map(record=>record.id));return db.recalls.filter(recall=>ids.has(recall.recordId)&&(!state.filters.notifyStatus||recall.status===state.filters.notifyStatus)&&(!state.filters.reminderStart||recall.date>=state.filters.reminderStart)&&(!state.filters.reminderEnd||recall.date<=state.filters.reminderEnd)).sort((first,second)=>first.date.localeCompare(second.date));}
function pageHead(){const title=navs.find(([page])=>page===state.page)[1];return `<div class="page-head breadcrumb-head"><div class="breadcrumb-bar"><span>体检管理 / ${title}</span></div><div class="head-actions"><span class="demo-note">模拟日期 ${TODAY} · 全部为虚构数据</span><button data-action="about">${icon('info')} 演示说明</button></div></div>`;}
function tabs(){if(state.page==='tracking')return `<div class="tabs" role="tablist" aria-label="追踪状态">${Object.entries(STATE_LABELS).map(([tab,label])=>`<button role="tab" aria-selected="${tab===state.tab}" class="${tab===state.tab?'active':''}" data-action="tab" data-tab="${tab}">${label}<span class="tab-count">${db.records.filter(record=>record.status===tab).length}</span></button>`).join('')}</div>`;if(state.page==='population')return `<div class="tabs" role="tablist" aria-label="体检人群"><button role="tab" aria-selected="${state.populationTab==='examined'}" class="${state.populationTab==='examined'?'active':''}" data-action="population-tab" data-tab="examined">已检人群<span class="tab-count">${db.records.length}</span></button><button role="tab" aria-selected="${state.populationTab==='unexamined'}" class="${state.populationTab==='unexamined'?'active':''}" data-action="population-tab" data-tab="unexamined">未检人群<span class="tab-count">${db.unexamined.length}</span></button></div>`;return '';}
function rangeField(label,prefix,start,end){return `<div class="field"><label>${label}：</label><div class="date-range"><input type="date" aria-label="${label}开始" name="${prefix}Start" value="${escapeHTML(start)}"><span>至</span><input type="date" aria-label="${label}结束" name="${prefix}End" value="${escapeHTML(end)}"></div></div>`;}
function filterPanel(){const filters=state.filters;const tracking=state.page==='tracking';return `<form id="filters" class="panel filter-panel"><div class="filter-row">${tracking?rangeField(taskDateLabel(),'due',filters.dueStart,filters.dueEnd):''}${rangeField('体检日期','exam',filters.start,filters.end)}${rangeField('总检日期','report',filters.reportStart,filters.reportEnd)}${state.page==='recall'?rangeField('提醒日期','reminder',filters.reminderStart||'',filters.reminderEnd||''):''}</div><div class="filter-row"><div class="field"><label for="filter-category">类别：</label><select id="filter-category" name="category"><option value="">全部类别</option>${['A','B','C'].map(category=>`<option value="${category}" ${filters.category===category?'selected':''}>${category}类（${category==='A'?'红':category==='B'?'黄':'蓝'}）</option>`).join('')}</select></div>${tracking&&!['pending','referred','closed'].includes(state.tab)?`<div class="field"><label for="filter-review">复查状态：</label><select id="filter-review" name="reviewStatus"><option value="">全部</option>${['已复查','已复查（部分）','未复查','--'].map(status=>`<option ${filters.reviewStatus===status?'selected':''}>${status}</option>`).join('')}</select></div>`:''}${(state.page==='recall'||tracking&&state.tab==='following')?`<div class="field"><label for="filter-notify">通知状态：</label><select id="filter-notify" name="notifyStatus"><option value="">全部</option>${['未通知','已通知'].map(status=>`<option ${filters.notifyStatus===status?'selected':''}>${status}</option>`).join('')}</select></div>`:''}${tracking&&state.tab==='tracking'?`<div class="field"><label for="filter-method">告知方式：</label><select id="filter-method" name="notifyMethod"><option value="">全部</option>${['面对面告知','电话告知'].map(method=>`<option ${filters.notifyMethod===method?'selected':''}>${method}</option>`).join('')}</select></div>`:''}${tracking&&state.tab==='following'?`<div class="field"><label for="filter-notifier">通知人：</label><select id="filter-notifier" name="notifier"><option value="">全部</option>${['陈医助','林医助'].map(name=>`<option ${filters.notifier===name?'selected':''}>${name}</option>`).join('')}</select></div>`:''}<div class="field"><label for="filter-keyword">患者：</label><input id="filter-keyword" type="search" name="keyword" placeholder="请输入姓名 / 身份证 / 报告编号" value="${escapeHTML(filters.keyword)}"></div><button class="primary" type="submit">查询</button><button type="button" data-action="clear-filters">重置</button><div class="legend"><span><i class="legend-dot dot-a"></i>A类 · 红</span><span><i class="legend-dot dot-b"></i>B类 · 黄</span><span><i class="legend-dot dot-c"></i>C类 · 蓝</span></div></div></form>`;}
function deadlineCell(date){const overdue=date<TODAY;return `<span class="deadline ${overdue?'overdue':''}">${escapeHTML(date)}<small>${overdue?'已过示例期限':'按示例期限排序'}</small></span>`;}
function paginate(records){const max=Math.max(1,Math.ceil(records.length/state.pageSize));state.pageNumber=Math.min(state.pageNumber,max);return records.slice((state.pageNumber-1)*state.pageSize,state.pageNumber*state.pageSize);}
function pagination(total){const pages=Math.max(1,Math.ceil(total/state.pageSize));return `<div class="pagination"><span>共 ${total} 条</span><span>每页</span><select aria-label="每页条数" id="page-size">${[5,10,20].map(size=>`<option ${size===state.pageSize?'selected':''}>${size}</option>`).join('')}</select><span>条</span><button aria-label="上一页" data-action="page" data-number="${state.pageNumber-1}" ${state.pageNumber===1?'disabled':''}>‹</button>${Array.from({length:pages},(_,index)=>`<button class="${state.pageNumber===index+1?'active':''}" data-action="page" data-number="${index+1}" aria-label="第${index+1}页">${index+1}</button>`).join('')}<button aria-label="下一页" data-action="page" data-number="${state.pageNumber+1}" ${state.pageNumber===pages?'disabled':''}>›</button></div>`;}
function recordTableBase(){const population=state.page==='population';let records=filteredRecords().filter(record=>population||record.status===state.tab).sort((first,second)=>state.tab==='pending'?first.due.localeCompare(second.due):String(second.closedDate||second.referral?.date||second.followDate||second.notify?.date||second.report).localeCompare(String(first.closedDate||first.referral?.date||first.followDate||first.notify?.date||first.report)));const paged=paginate(records);const title=population?'已检人群':STATE_LABELS[state.tab];const columns=population?['序号','姓名','性别','年龄','类别','体检日期','总检日期','体检套餐','管理状态','A类异常数','B类异常数','C类异常数','操作']:['序号','姓名','性别','年龄','类别','体检日期','总检日期',taskDateLabel(),state.tab==='pending'?'告知状态':'复查状态','体检机构','A类异常数','B类异常数','C类异常数','联系方式','操作'];return `<section class="panel"><div class="table-head"><div class="table-title"><h2>${title}（${records.length}）</h2><small>${population?'按体检报告展示 · 患者示例均为单份报告':'一份体检报告对应一条任务'}</small></div><button data-action="export">${icon('export')} 导出</button></div><div class="table-wrap"><table class="table wide-table"><thead><tr>${columns.map(label=>`<th>${label}</th>`).join('')}</tr></thead><tbody>${paged.map((record,index)=>`<tr><td>${(state.pageNumber-1)*state.pageSize+index+1}</td><td class="person">${record.name}</td><td>${record.sex}</td><td>${record.age}</td><td>${categoryBadge(record)}</td><td>${record.exam}</td><td>${record.report}</td>${population?`<td>${record.package}</td><td>${statusBadge(record.status)}</td>`:`<td>${state.tab==='closed'?record.closedDate:state.tab==='referred'?record.referral?.date:state.tab==='following'?record.groups.map(group=>group.date).join(' / ')||'—':deadlineCell(state.tab==='pending'?record.due:record.followDue||record.due)}</td><td>${state.tab==='pending'?statusBadge('pending'):textBadge(reviewStatus(record),reviewStatus(record)==='已复查'?'closed':'neutral')}</td><td>${record.institution}</td>`}${['A','B','C'].map(category=>`<td class="num-${category.toLowerCase()}">${record.items.filter(item=>item.category===category).length}</td>`).join('')}${population?'':`<td>${record.phone}</td>`}<td class="ops"><button class="link" data-action="detail" data-id="${record.id}">查看</button>${!population&&record.status==='pending'?`<button class="link" data-action="inform" data-id="${record.id}">告知</button><button class="link" data-action="call" data-id="${record.id}">一键拨号</button>`:!population&&record.status!=='closed'?`<button class="link" data-action="follow" data-id="${record.id}">去跟踪</button>`:population?`<button class="link" data-action="compare" data-id="${record.id}">3年对比</button>`:''}</td></tr>`).join('')}</tbody></table>${!records.length?`<div class="empty">${icon('empty')}<div>没有符合筛选条件的任务</div><small>请调整筛选条件，或点击“重置”查看示例数据</small></div>`:''}</div>${pagination(records.length)}</section>`;}
function populationOverview(){
  const records=populationRecords(true);
  return `<section class="category-panel"><h2>类别等级统计 <span class="muted" title="当前筛选范围内，按每位患者最新一份总检报告分类">ⓘ</span></h2><div class="category-row">${['A','B','C'].map(category=>{const count=records.filter(record=>record.category===category).length;return `<button type="button" class="category-stat ${state.filters.category===category?'selected':''}" data-action="population-category" data-category="${category}" aria-pressed="${state.filters.category===category}"><div><span class="color-icon ${category}">♡</span>${category}类（${category==='A'?'红':category==='B'?'黄':'蓝'}）</div><strong>${count}</strong><small>占比 ${rate(count,records.length)}</small></button>`;}).join('')}</div></section>`;
}
function unexaminedTable(){
  const patients=unexaminedPatients();

function rate(numerator,denominator){return denominator?Math.round(numerator/denominator*100)+'%':'—';}
function bar(label,count,total,color,unit='份'){return `<div class="bar-row"><span class="bar-label">${label}</span><div class="bar-track"><div class="bar-fill" style="width:${total?count/total*100:0}%;background:${color||'var(--blue)'}"></div></div><span class="bar-number">${count} ${unit}</span></div>`;}
function statistics(){
  const records=statsRecords();const informed=records.filter(record=>record.notify);const eligible=records.filter(record=>record.notify&&!record.normal);const followed=eligible.filter(record=>record.followDate||record.referral||record.end);const closed=eligible.filter(record=>record.status==='closed');const referred=eligible.filter(record=>record.referral);const timely=informed.filter(record=>record.notify.date<=record.due);const timelyFollow=followed.filter(record=>(record.firstFollowDate||record.referral?.date||record.closedDate)<=record.followDue);const categories=['A','B','C'];const counts=categories.map(category=>records.filter(record=>record.category===category).length);
  const eligiblePeople=new Set(records.map(record=>record.identity));const unexamined=db.unexamined.filter(patient=>!patient.examYears.includes((state.statsFilters||{year:'2026'}).year)&&(!(state.statsFilters?.doctor)||patient.doctor===state.statsFilters.doctor));
  const metrics=[['体检率',eligiblePeople.size,eligiblePeople.size+unexamined.length,'已体检','应体检','人'],['告知率',informed.length,records.length,'已告知','应告知','人次'],['告知及时率',timely.length,records.length,'按时告知','应告知','人次'],['异常告知及时率',timely.filter(record=>!record.normal).length,records.filter(record=>!record.normal).length,'按时告知异常','应告知异常','人次'],['跟踪率',followed.length,eligible.length,'已跟踪','应跟踪','人次'],['自主跟踪率',null,null,'已自主跟踪','应自主跟踪','人次'],['跟踪及时率',timelyFollow.length,eligible.length,'按时跟踪','应跟踪','人次'],['自主跟踪及时率',null,null,'按时自主跟踪','应自主跟踪','人次'],['跟踪闭环率',closed.length,eligible.length,'跟踪结束','应跟踪','人次'],['转诊率',referred.length,eligible.length,'已转诊','应跟踪','人次']];
  const cards=`<section class="stats-panel stats-overview"><h2>核心概览</h2><div class="stats-metrics">${metrics.map(([label,numerator,denominator,numeratorLabel,denominatorLabel,unit])=>`<div class="stats-metric"><h3>${label} <span title="${numerator===null?'暂无自主到院事实，不能从操作状态推断':numeratorLabel+' / '+denominatorLabel+'；本地演示口径'}">ⓘ</span></h3><strong>${numerator===null?'—':rate(numerator,denominator)}</strong><p>${numeratorLabel} ${numerator??'—'} ${unit}</p><p>${denominatorLabel} ${denominator??'—'} ${unit}</p></div>`).join('')}</div></section>`;
  let offset=0;const circumference=2*Math.PI*59;
  const donut=`<div class="stats-donut"><svg viewBox="0 0 160 160" role="img" aria-label="三色类别分布"><circle cx="80" cy="80" r="59" fill="none" stroke="#edf1f6" stroke-width="14"/>${counts.map((count,index)=>{const length=records.length?count/records.length*circumference:0;const segment=`<circle cx="80" cy="80" r="59" fill="none" stroke="${['#fa454d','#f5b51a','#1989ff'][index]}" stroke-width="14" stroke-dasharray="${length} ${circumference-length}" stroke-dashoffset="${-offset}" transform="rotate(-90 80 80)"/>`;offset+=length;return segment;}).join('')}<text x="80" y="80" text-anchor="middle" font-size="25" fill="#26344b">${records.length}</text><text x="80" y="101" text-anchor="middle" class="axis-label">已体检人次</text></svg><div>${categories.map((category,index)=>`<p><i class="legend-dot dot-${category.toLowerCase()}"></i>${category}类 <strong>${counts[index]}</strong><span>${rate(counts[index],records.length)}</span></p>`).join('')}</div></div>`;
  const buckets=['按时完成','超期≤7天','超期1–2周','超期2–4周','超期>1月'];
  const lagSeries=categories.map(category=>buckets.map((label,index)=>informed.filter(record=>record.category===category&&(()=>{const lag=daysBetween(record.due,record.notify.date);return (lag<=0?0:lag<=7?1:lag<=14?2:lag<=28?3:4)===index;})()).length));
  const methods=['转诊','持续跟踪','跟踪结束'];const methodSeries=categories.map(category=>methods.map((label,index)=>followed.filter(record=>record.category===category&&firstTrackingAction(record)===['referred','following','closed'][index]).length));
  const funnel=`<div class="stats-funnel">${[['体检人数',records.length],['转诊发起人数',referred.length],['预约成功人数','—'],['实际就诊人数','—']].map(([label,count],index)=>`<div style="width:${100-index*12}%;background:${['#1989ff','#479eff','#76b7ff','#acd3ff'][index]}">${label}<strong>${count}</strong></div>`).join('')}</div><p class="chart-caption">未接入预约及就诊事实，未知结果不按 0 或成功处理。</p>`;
  const averages=categories.map(category=>{const subset=closed.filter(record=>record.category===category);return subset.length?Number((subset.reduce((sum,record)=>sum+daysBetween(record.notify.date,record.closedDate),0)/subset.length).toFixed(1)):0;});
  const projectRows=EXAM_PROJECTS.map(project=>{const items=records.flatMap(record=>reportDisplayItems(record).filter(item=>item.group===project));return {project,total:items.length,counts:categories.map(category=>items.filter(item=>item.category===category).length),abnormal:items.filter(item=>item.category).length};});
  const itemTable=`<div class="table-wrap"><table class="stats-item-table"><thead><tr><th>体检项目</th>${categories.map(category=>`<th class="header-${category}">${category}类</th>`).join('')}</tr></thead><tbody>${projectRows.map(entry=>`<tr><td>${entry.project}</td>${entry.counts.map(count=>`<td>${rate(count,entry.total)} (${count}/${entry.total})</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const detection=`<div class="table-wrap"><table class="stats-item-table"><thead><tr><th>序号</th><th>体检项目</th><th>异常检出率</th></tr></thead><tbody>${projectRows.map((entry,index)=>`<tr><td>${index+1}</td><td>${entry.project}</td><td>${rate(entry.abnormal,entry.total)} (${entry.abnormal}/${entry.total})</td></tr>`).join('')}</tbody></table></div>`;
  const trendMonths=Array.from({length:12},(_,index)=>index+1);const monthly=trendMonths.map(month=>{const entries=eligible.filter(record=>Number(record.report.slice(5,7))===month);const ended=entries.filter(record=>record.status==='closed').length;return {total:entries.length,ended,percentage:entries.length?ended/entries.length*100:0};});const maxEnded=Math.max(1,...monthly.map(entry=>entry.ended));
  const trend=`<svg class="stats-svg" viewBox="0 0 700 250" role="img" aria-label="跟踪闭环月度趋势">${[0,25,50,75,100].map(value=>`<text x="27" y="${205-value*1.7}" class="axis-label">${value}</text><line x1="48" y1="${200-value*1.7}" x2="670" y2="${200-value*1.7}" stroke="#eef1f6"/>`).join('')}${monthly.map((entry,index)=>`<rect x="${56+index*51}" y="${200-entry.ended/maxEnded*125}" width="19" height="${entry.ended/maxEnded*125}" fill="#1989ff"><title>${index+1}月：跟踪结束 ${entry.ended} 人次；闭环率 ${entry.total?rate(entry.ended,entry.total):'无数据'}</title></rect><text x="${66+index*51}" y="225" text-anchor="middle" class="axis-label">${index+1}月</text>`).join('')}<polyline points="${monthly.filter(entry=>entry.total).map(entry=>`${66+monthly.indexOf(entry)*51},${200-entry.percentage*1.7}`).join(' ')}" stroke="#1989ff" stroke-width="2" fill="none"/>${monthly.map((entry,index)=>entry.total?`<circle cx="${66+index*51}" cy="${200-entry.percentage*1.7}" r="4" fill="#1989ff"><title>闭环率 ${rate(entry.ended,entry.total)}</title></circle>`:'').join('')}</svg><p class="chart-caption">柱：跟踪结束人次；折线：闭环率（%）。无任务月份不绘制闭环率。</p>`;
  const institutions=[...new Set(records.map(record=>record.institution))].map(institution=>{const subset=eligible.filter(record=>record.institution===institution);return {institution,total:subset.length,ended:subset.filter(record=>record.status==='closed').length};}).sort((first,second)=>(second.total?second.ended/second.total:0)-(first.total?first.ended/first.total:0));
  const ranking=`<div class="table-wrap"><table class="stats-item-table"><thead><tr><th>排名</th><th>机构</th><th>跟踪闭环率</th></tr></thead><tbody>${institutions.map((entry,index)=>`<tr><td>${index+1}</td><td>${entry.institution}</td><td>${rate(entry.ended,entry.total)} (${entry.ended}/${entry.total})</td></tr>`).join('')}</tbody></table></div>`;
  return `${cards}<div class="stats-grid">${statsPanel('类别分布',donut)}${statsPanel('告知时效分布',stackedChart(buckets,lagSeries))}${statsPanel('自主跟踪时效分布','<div class="empty">暂无自主到院记录</div>')}${statsPanel('首次跟踪方式分布',stackedChart(methods,methodSeries))}${statsPanel('转诊转化',funnel)}${statsPanel('平均跟踪闭环时间',stackedChart(categories.map(category=>category+'类'),categories.map((category,index)=>averages.map((value,valueIndex)=>valueIndex===index?value:0)),'天'))}${statsPanel('体检项目三色占比',itemTable,true)}${statsPanel('异常检出率',detection)}${statsPanel('跟踪闭环趋势',trend,true)}${statsPanel('跟踪闭环率机构排名',ranking)}</div><p class="chart-caption">虚构数据演示：按总检年份筛选，指标分子/分母为本地展示口径，不作为已核定的正式考核口径；自主跟踪与外部预约/到院数据未接入。</p>`;
}

function filterPanel(){
  const filters=state.filters;const tracking=state.page==='tracking';const review=state.page==='review';
  const category=`<div class="field"><label for="filter-category">类别：</label><select id="filter-category" name="category"><option value="">全部类别</option>${['A','B','C'].map(value=>`<option value="${value}" ${filters.category===value?'selected':''}>${value}类（${value==='A'?'红':value==='B'?'黄':'蓝'}）</option>`).join('')}</select></div>`;

  const notifyMethod=tracking&&state.tab==='tracking'?`<div class="field"><label for="filter-method">告知方式：</label><select id="filter-method" name="notifyMethod"><option value="">全部</option>${['面对面告知','电话告知'].map(value=>`<option ${filters.notifyMethod===value?'selected':''}>${value}</option>`).join('')}</select></div>`:'';
  const notifier=tracking&&state.tab==='following'?`<div class="field"><label for="filter-notifier">通知人：</label><select id="filter-notifier" name="notifier"><option value="">全部</option>${['陈医助','林医助'].map(value=>`<option ${filters.notifier===value?'selected':''}>${value}</option>`).join('')}</select></div>`:'';

function renderBase(){renderNav();let body=(state.page==='tracking'?'':pageHead())+tabs();if(state.page==='population'&&state.populationTab==='unexamined')body+=unexaminedTable();else{body+=state.page==='stats'?statsFilters():filterPanel();if(state.page==='population')body+=populationOverview()+recordTable();if(state.page==='tracking')body+=recordTable();if(state.page==='review')body+=reviewTaskTable();if(state.page==='recall')body+=recallTable();if(state.page==='stats')body+=statistics();}document.getElementById('app').innerHTML=body+`<div class="end-note">V3.0 交互原型 · 无真实患者数据 · 无实际拨号或转诊 · 刷新保留本地演示操作</div>`;}

function showOverlay(content,type='drawer'){state.originFocus=document.activeElement;state.panel=null;document.getElementById('overlay-root').innerHTML=`<div class="overlay ${type==='modal'?'modal-overlay':''}" id="overlay"><section class="${type}" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1">${content}</section></div>`;const target=document.querySelector('#overlay button');target?.focus();document.body.style.overflow='hidden';}

function modal(title,body,footer,floating=false){const content=`<div class="drawer-head"><h2 id="modal-title">${title}</h2><button class="icon-button" aria-label="关闭弹窗" data-action="close">×</button></div><div class="drawer-body">${body}<div id="form-error"></div></div><div class="drawer-footer"><span></span><div class="actions">${footer||'<button class="primary" data-action="close">知道了</button>'}</div></div>`;if(floating&&['inform','detail','follow'].includes(state.drawer?.returnTo?.type||state.drawer?.type)){document.getElementById('modal-layer')?.remove();state.panel={title,origin:document.activeElement};document.getElementById('overlay-root').insertAdjacentHTML('beforeend',`<div class="overlay modal-overlay layered-modal" id="modal-layer"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">${content}</section></div>`);document.querySelector('#modal-layer button')?.focus();return;}if(state.drawer?.returnTo?.type==='inform'&&document.querySelector('.inform-drawer')){document.getElementById('modal-layer')?.remove();state.panel=null;document.querySelector('.inform-drawer').setAttribute('aria-hidden','true');document.getElementById('overlay-root').insertAdjacentHTML('beforeend',`<div class="overlay modal-overlay layered-modal" id="modal-layer"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">${content}</section></div>`);document.querySelector('#modal-layer button')?.focus();return;}showOverlay(content.replace('id="modal-title"','id="dialog-title"'),'modal');}

function openDetail(id,detailTab='report'){if(findRecord(id).status==='pending'&&state.page==='tracking'){openInform(id);return;}stopRecordingPlayback();hideSuggestion();state.drawer={type:'detail',id,detailTab};detailDrawer();}
function detailDrawer(){
  const record=findRecord(state.drawer.id);
  const current=state.drawer.detailTab;
  let tabsList=[['report','体检异常'],['calls','拨号记录'],['history','操作历史']];
  if(record.status==='referred')tabsList=[['visits','就诊记录'],['referral','转诊单'],...tabsList];
  else if(record.status==='following'||record.notify&&record.groups.some(group=>group.items.some(id=>itemHasReview(record,id))))tabsList=[['follow','复查详情'],...tabsList];
  let body='';
  if(current==='report')body=`<div class="report-section-line"><h3>体检异常 ${record.status==='tracking'?`<span class="red-text">跟踪期限：${record.followDue||'—'}</span>`:record.status==='pending'?`<span class="red-text">告知期限：${record.due}</span>`:''}</h3><button class="link" data-action="compare" data-id="${record.id}">3年体检数据详情 ›</button></div>${groupedReport(record)}${record.notify?followDescription(record)+reviewProjectMarkup(record):''}`;
  if(current==='history')body=historyMarkup(record);
  if(current==='calls')body=callHistoryMarkup(record);
  if(current==='follow'||current==='visits')body=reviewTimeline(record);
  if(current==='referral')body=referralMarkup(record);
  const actions=record.status==='pending'?`<button data-action="inform" data-id="${record.id}">告知</button><button class="primary" data-action="call" data-id="${record.id}">一键拨号</button>`:record.status==='closed'?'<button class="primary" data-action="close">确定</button>':`<button data-action="follow-direct" data-id="${record.id}" data-mode="closed">跟踪结束</button>${record.status==='referred'?'':`<button data-action="follow-direct" data-id="${record.id}" data-mode="following">持续跟踪</button><button class="primary" data-action="follow-direct" data-id="${record.id}" data-mode="referred">转诊</button>`}`;
  showOverlay(`<div class="drawer-head"><h2 id="dialog-title">异常详情</h2><button class="icon-button" data-action="close" aria-label="关闭异常详情">×</button></div><div class="drawer-body">${patientCard(record)}<div class="detailtabs" role="tablist" aria-label="详情分类">${tabsList.map(([tab,label])=>`<button role="tab" aria-selected="${current===tab}" class="${current===tab?'active':''}" data-action="detail-tab" data-tab="${tab}">${label}</button>`).join('')}</div>${body}</div><div class="drawer-footer"><span class="left-date">总检日期：${record.report}</span><div class="actions">${actions}</div></div>`);
}

function newReviewGroup(baseDate=TODAY){return {id:'G'+Date.now()+Math.random().toString(36).slice(2,6),items:[],datePreset:'7d',date:addDays(baseDate,7),needsAssistant:true,assistant:'陈医助',lead:1};}
function openInform(id){const record=findRecord(id);if(record.status!=='pending'){toast('该报告已告知，不能再次修改类别');return;}stopRecordingPlayback();hideSuggestion();state.drawer={type:'inform',id,detailTab:'report',step:2,draft:{category:record.category,reason:'',confirmed:false,method:'电话告知',date:TODAY,target:'本人',result:'已告知',note:'',groups:[newReviewGroup(TODAY)]}};informDrawer();}
function stepsMarkup(step){return `<div class="steps" role="tablist" aria-label="告知步骤">${['分类判定确认','告知结果','异常复查设置'].map((label,index)=>`<button type="button" role="tab" aria-selected="${step===index+1}" class="step ${step===index+1?'active':step>index+1?'done':''}" data-action="inform-step" data-step="${index+1}"><span class="step-number">${step>index+1?'✓':index+1}</span>${label}</button>`).join('')}</div>`;}
function trackingDeadline(draft){return addDays(draft.date||TODAY,draft.category==='A'?10:draft.category==='B'?30:90);}
function informDrawer(){const drawer=state.drawer;const record=findRecord(drawer.id);const draft=drawer.draft;let body='';if(drawer.step===1)body=`<h3 class="section-title">报告分类判定</h3><div class="report-summary"><span>原类别</span>${textBadge(record.category+'类',record.category)}<span class="push muted">告知期限：${record.due}</span></div><div class="form-grid"><fieldset class="form-field"><legend>确认报告类别</legend><div class="category-radios">${(record.normal?['C']:['A','B','C']).map(category=>`<label><input type="radio" name="confirm-category" value="${category}" ${category===draft.category?'checked':''}>${category}类</label>`).join('')}</div></fieldset><div class="form-field"><label for="correction-reason">修订原因</label><input id="correction-reason" value="${escapeHTML(draft.reason)}" placeholder="请输入修订原因"><div class="preset-choices compact">${['初判错误修正','复检正常'].map(value=>`<button type="button" data-action="correction-preset" data-result="${value}">${value}</button>`).join('')}</div></div></div><label id="classification-confirmation" class="checkbox" style="margin-top:20px" ${draft.category===record.category?'hidden':''}><input id="classification-confirmed" type="checkbox" ${draft.confirmed?'checked':''}>已核对本次体检报告，确认上述类别</label>`;
if(drawer.step===2)body=`<h3 class="section-title">录入告知结果</h3><div class="report-summary"><span>确认类别</span>${textBadge(draft.category+'类',draft.category)}<span class="push muted">告知期限：${record.due}</span></div><div class="form-grid"><div class="form-field"><label class="required">告知方式</label><div class="choice-radios">${['电话告知','面对面告知'].map(method=>`<label><input type="radio" name="inform-method" value="${method}" ${draft.method===method?'checked':''}>${method}</label>`).join('')}</div></div><div class="form-field"><label for="inform-date" class="required">告知日期</label><input id="inform-date" type="date" value="${draft.date}" min="${record.report}" max="${TODAY}"></div><div class="form-field full"><label for="inform-content">告知内容</label><input id="inform-content" maxlength="200" value="${escapeHTML(draft.note)}" placeholder="请输入告知内容，最多200字"></div></div>`;
if(drawer.step===3)body=record.normal?`<div class="report-summary deadline-pair"><span>告知期限：<span class="red-text">${record.due}</span></span><span>跟踪期限：<span class="red-text">${trackingDeadline(draft)}</span></span></div><div class="all-normal" style="margin-top:16px">${icon('check')}体检报告全部指标未见异常<p style="margin-top:7px;font-size:12px">完成告知后自动进入“跟踪结束”，无需设置复查任务。</p></div><div class="review-plan"><h3>将自动生成跟踪结束信息</h3><p class="muted" style="margin-top:10px">末次跟踪日期：${draft.date}<br>跟踪方式：${draft.method==='电话告知'?'电话跟踪':'面对面跟踪'}<br>跟踪结束原因：无需跟踪</p></div>`:`<div class="report-summary deadline-pair"><span>告知期限：<span class="red-text">${record.due}</span></span><span>跟踪期限：<span class="red-text">${trackingDeadline(draft)}</span></span></div>${reviewEditor(record,draft)}`;
informShell(record,body);}

function normalizedReviewGroup(group,baseDate){group.datePreset??='custom';group.needsAssistant??=true;group.assistant??='陈医助';group.lead??=1;if(group.date===undefined)group.date=addDays(baseDate,7);return group;}
function reviewSelectionLabel(record,ids){const names=ids.map(id=>record.items.find(item=>item.id===id)?.name).filter(Boolean);return names.length?`已选${names.length}项：${names.join('、')}`:'请选择异常检验检查项目';}
function reviewDateFromPreset(base,preset){if(preset==='7d')return addDays(base,7);if(preset==='14d')return addDays(base,14);if(preset==='1m')return addMonths(base,1);if(preset==='3m')return addMonths(base,3);if(preset==='6m')return addMonths(base,6);return '';}
function reviewEditor(record,draft){const groups=draft.groups;const items=record.items.filter(item=>item.category).sort((first,second)=>'ABC'.indexOf(first.category)-'ABC'.indexOf(second.category));const displayGroup=item=>({血糖:'生化',血脂:'生化',影像检查:'B超'})[item.group]||item.group;const labGroups=['血常规','尿常规','生化','大便OB','乙肝表面抗原'];const renderPicker=(group,index)=>{const sections=[['检验',items.filter(item=>labGroups.includes(displayGroup(item)))],['检查',items.filter(item=>!labGroups.includes(displayGroup(item)))]];const available=items.filter(item=>!groups.some((other,otherIndex)=>otherIndex!==index&&other.items.includes(item.id)));return `<details class="multi-select"><summary><span class="review-summary-text">${escapeHTML(reviewSelectionLabel(record,group.items))}</span></summary><div class="multi-select-menu"><label><input type="checkbox" data-select-all="${index}" ${available.length&&available.every(item=>group.items.includes(item.id))?'checked':''}>全部异常项目</label>${sections.map(([title,sectionItems])=>sectionItems.length?`<div class="review-category">${title}</div>${[...new Set(sectionItems.map(displayGroup))].map(project=>{const projectItems=sectionItems.filter(item=>displayGroup(item)===project);const counts=['A','B','C'].map(category=>`${category}类${projectItems.filter(item=>item.category===category).length}个`).filter(text=>!text.endsWith('0个')).join(' ');return `<div class="review-project-group"><label class="review-project-head"><input type="checkbox" data-select-project="${index}" data-project="${escapeHTML(project)}" ${projectItems.every(item=>group.items.includes(item.id))?'checked':''}>${escapeHTML(project)}<small>共${projectItems.length}个 ${counts}</small></label><div class="review-project-items">${projectItems.map(item=>{const used=groups.some((other,otherIndex)=>otherIndex!==index&&other.items.includes(item.id));return `<label><input type="checkbox" data-group-item="${index}" data-project-name="${escapeHTML(project)}" value="${item.id}" ${group.items.includes(item.id)?'checked':''} ${used?'disabled':''}>${escapeHTML(item.name)} ${textBadge(item.category+'类',item.category)}</label>`;}).join('')}</div></div>`;}).join('')}`:'').join('')}</div></details>`;};return `<h3 class="section-title">按异常项目设置分组复查</h3><div class="info-strip optional-hint">异常复查设置为非必填。若仅有轻微异常，医生判断无需复查，可不选择项目并直接完成告知。</div>${groups.map((rawGroup,index)=>{const group=normalizedReviewGroup(rawGroup,draft.date||TODAY);const custom=group.datePreset==='custom';return `<div class="review-plan" data-group-index="${index}"><div class="review-plan-head"><h3>复查组 ${index+1}</h3><button class="icon-button" data-action="delete-group" data-index="${index}" aria-label="删除复查组 ${index+1}" title="删除复查组">${icon('trash')}</button></div><div class="form-field"><label>复查项目</label>${renderPicker(group,index)}</div><div class="form-grid review-config"><div class="form-field full"><label for="review-preset-${index}">复查日期</label><div class="review-date-row"><select id="review-preset-${index}" data-plan-field="datePreset" data-index="${index}"><option value="">请选择</option>${[['7d','7天后'],['14d','14天后'],['1m','1个月'],['3m','3个月'],['6m','6个月'],['custom','自定义']].map(([value,label])=>`<option value="${value}" ${group.datePreset===value?'selected':''}>${label}</option>`).join('')}</select><input id="review-date-${index}" data-plan-field="date" data-index="${index}" type="date" min="${draft.date||TODAY}" max="${addDays(record.report,365)}" value="${group.date||''}" ${custom?'':'readonly'}></div></div><div class="form-field full"><label>需要医助通知</label><div class="assistant-choice">${[['true','是'],['false','否']].map(([value,label])=>`<label><input type="radio" name="needs-assistant-${index}" data-needs-assistant="${index}" value="${value}" ${String(group.needsAssistant)===value?'checked':''}>${label}</label>`).join('')}</div></div>${group.needsAssistant?`<div class="form-field"><label for="review-assistant-${index}">请提醒</label><select id="review-assistant-${index}" data-plan-field="assistant" data-index="${index}">${['陈医助','林医助'].map(name=>`<option ${group.assistant===name?'selected':''}>${name}</option>`).join('')}</select></div><div class="form-field"><label for="review-lead-${index}">提醒</label><select id="review-lead-${index}" data-plan-field="lead" data-index="${index}">${[1,2,3,4,5,6,7].map(days=>`<option value="${days}" ${group.lead===days?'selected':''}>${days===7?'1周前':days+'天前'}</option>`).join('')}</select></div>`:''}</div></div>`;}).join('')}<button data-action="add-group" style="width:100%;border-style:dashed;color:var(--blue);padding:10px;margin-bottom:17px">＋ 添加复查组</button>`;}
function captureInform(){const drawer=state.drawer;const draft=drawer.draft;const record=findRecord(drawer.id);if(drawer.step===1){draft.category=document.querySelector('input[name="confirm-category"]:checked')?.value||draft.category;draft.reason=document.getElementById('correction-reason').value.trim();draft.confirmed=document.getElementById('classification-confirmed')?.checked||false;}if(drawer.step===2){draft.method=document.querySelector('input[name="inform-method"]:checked')?.value||draft.method;draft.date=document.getElementById('inform-date').value;draft.note=document.getElementById('inform-content').value.trim();draft.result='已告知';}return record;}
function syncInformCall(record,draft){const call=record.calls.find(entry=>entry.id===draft.callId);if(call){call.result=draft.result;call.note=draft.note;call.notifier=record.doctor;}}
function validateInformStep(step,record,draft){if(step===1&&draft.category!==record.category&&!draft.confirmed)return formError('修改报告类别时，请勾选确认。');if(step===2&&(!draft.date||draft.date<record.report||draft.date>TODAY))return formError('告知日期须在总检日期至演示当日之间。');return true;}
function goInformStep(target){const record=captureInform();const drawer=state.drawer;const draft=drawer.draft;if(target>drawer.step){for(let step=drawer.step;step<target;step++){if(!validateInformStep(step,record,draft))return;}}drawer.step=target;informDrawer();}
function informNext(){const record=captureInform();const drawer=state.drawer;if(!validateInformStep(drawer.step,record,drawer.draft))return;drawer.step++;informDrawer();}
function validateGroups(record,draft){const used=new Set();for(const group of draft.groups.filter(entry=>entry.items.length)){if(group.date&&(group.date<(draft.date||TODAY)||group.date>addDays(record.report,365)))return formError('复查日期不得早于告知 / 本次跟踪日期，且不得超过总检日期＋365天。');if(group.needsAssistant&&(!group.date||!group.assistant))return formError('需要医助通知时，请设置复查日期和提醒医助。');for(const itemId of group.items){if(used.has(itemId))return formError('同一异常项目不能加入多个复查组。');used.add(itemId);}}return true;}
function generateRecalls(record,groups){groups.filter(group=>group.needsAssistant!==false&&group.date).forEach(group=>{if(db.recalls.some(recall=>recall.recordId===record.id&&recall.groupId===group.id))return;db.recalls.push({id:'RC'+record.id+group.id,recordId:record.id,groupId:group.id,date:addDays(group.date,-group.lead),reviewDate:group.date,assistant:group.assistant,status:'未通知',result:'',note:'',notifiedDate:''});log(record,'创建了召回通知任务','AI系统');log(record,`通知${group.assistant}召回患者复查`,'AI系统');});}
function finishInform(){const drawer=state.drawer;const draft=drawer.draft;const record=findRecord(drawer.id);if(draft.category!==record.category&&!draft.confirmed)return formError('修改报告类别后，须勾选确认。');draft.groups=draft.groups.filter(group=>group.items.length);if(!record.normal&&!validateGroups(record,draft))return;draft.groups.forEach(group=>{group.source='告知时设置';group.createdAt=draft.date+' 10:30';});record.originalCategory=record.category;record.category=draft.category;record.correctionReason=draft.category===record.originalCategory?'':draft.reason;record.confirmed=true;record.notify={date:draft.date,method:draft.method,target:'本人',result:draft.result,note:draft.note};record.followDue=trackingDeadline(draft);record.groups=record.normal?[]:structuredClone(draft.groups);syncInformCall(record,draft);if(draft.category!==record.originalCategory)log(record,`修改了报告类别，由 ${record.originalCategory}类 改为 ${record.category}类${draft.reason?'，备注：'+draft.reason:''}`);log(record,`完成告知，告知方式：${draft.method}，告知日期：${draft.date}`);if(record.groups.length)log(record,'完成异常复查设置');if(record.normal){record.status='closed';record.closedDate=draft.date;record.end={date:draft.date,method:draft.method==='电话告知'?'电话跟踪':'面对面跟踪',reason:'无需跟踪',note:'体检报告未见异常'};log(record,'更新了[跟踪状态]为 跟踪结束');}else{record.status='tracking';log(record,'创建了体检异常待跟踪任务','AI系统');generateRecalls(record,record.groups);}persist();closeOverlay();render();toast(record.normal?'告知完成，未见异常报告已自动结束':'告知完成，已进入“已告知待跟踪”');}
function openFollow(id){const record=findRecord(id);if(!record||record.status==='pending'||record.status==='closed')return;state.drawer={type:'follow',id,mode:'following',draft:{date:TODAY,groups:[]}};followDrawer();}
function followDrawer(){const drawer=state.drawer;const record=findRecord(drawer.id);let body='';if(drawer.mode==='following')body=reviewEditor(record,drawer.draft)+`<div class="form-field"><label for="follow-note">补充描述</label><textarea id="follow-note" maxlength="200" placeholder="请输入补充描述">${escapeHTML(drawer.draft.note||'')}</textarea></div><p class="version-note">已有计划保留在报告详情。此处新增计划，不替换历史召回记录。</p>`;if(drawer.mode==='referred')body=`<h3 class="section-title">转诊信息</h3><div class="notice">演示只保存本地转诊单，不会发送到医院或双向转诊系统。</div><div class="form-grid"><div class="form-field"><label for="referral-hospital" class="required">转入医院</label><select id="referral-hospital"><option>某某区人民医院</option><option>某某市第一人民医院</option></select></div><div class="form-field"><label for="referral-dept" class="required">转入科室</label><select id="referral-dept"><option>全科医学科</option><option>内分泌科</option><option>心血管内科</option></select></div><div class="form-field full"><label for="referral-reason" class="required">转诊原因</label><textarea id="referral-reason" maxlength="200" placeholder="请填写转诊原因，不超过200字"></textarea></div></div>`;if(drawer.mode==='closed')body=`<h3 class="section-title">跟踪结束信息</h3><div class="form-grid"><div class="form-field"><label class="required" for="end-date">末次跟踪日期</label><input type="date" id="end-date" min="${record.notify.date}" max="${TODAY}" value="${TODAY}"></div><div class="form-field"><label class="required" for="end-method">跟踪方式</label><select id="end-method"><option>电话跟踪</option><option>面对面跟踪</option></select></div><div class="form-field full"><label class="required" for="end-reason">跟踪结束原因</label><select id="end-reason"><option value="">请选择</option>${['复查正常','非重要异常可忽略','已面对面跟踪','无需跟踪','其他'].map(reason=>`<option>${reason}</option>`).join('')}</select></div><div class="form-field full"><label for="end-note">补充描述（选择其他时必填）</label><textarea id="end-note" maxlength="200" placeholder="记录跟踪结论，不超过200字"></textarea></div></div><div class="notice" style="margin-top:16px">结束本次报告管理，不意味着医学上已治愈。其他报告或服务任务不受影响。</div>`;
showOverlay(`<div class="drawer-head"><h2 id="dialog-title">检后跟踪处理</h2><button class="icon-button" data-action="close" aria-label="关闭跟踪">×</button></div><div class="drawer-body">${patientCard(record)}<div class="report-summary"><span>当前状态</span>${statusBadge(record.status)}<span class="push muted">复查：${reviewStatus(record)}</span></div><div class="segmented">${[['following','持续跟踪'],['referred','转诊'],['closed','跟踪结束']].map(([mode,label])=>`<button class="${drawer.mode===mode?'active':''}" data-action="follow-mode" data-mode="${mode}">${label}</button>`).join('')}</div>${body}<div id="form-error"></div></div><div class="drawer-footer"><small>仅影响本次体检报告任务</small><div class="actions"><button data-action="close">取消</button><button class="primary" data-action="follow-save">${drawer.mode==='closed'?'确认跟踪结束':'保存'+STATE_LABELS[drawer.mode]}</button></div></div>`);}
function saveFollow(){
  const drawer=state.drawer;const record=findRecord(drawer.id);
  if(drawer.mode==='following'){
    if(!drawer.draft.groups.length)return formError('请添加至少一个复查组。');
    if(!validateGroups(record,drawer.draft))return;
    drawer.draft.groups.forEach(group=>{group.source='持续跟踪时设置';group.createdAt=TODAY+' '+new Date().toTimeString().slice(0,5);});
    record.activeGroupIds=drawer.draft.groups.map(group=>group.id);
    record.followNote=document.getElementById('follow-note').value.trim();
    record.groups.push(...structuredClone(drawer.draft.groups));
    record.firstFollowDate??=TODAY;record.followDate=TODAY;
    log(record,'更新了跟踪状态为持续跟踪');
    generateRecalls(record,drawer.draft.groups);
  }
  if(drawer.mode==='referred'){
    const reason=document.getElementById('referral-reason').value.trim();if(!reason)return formError('请填写转诊原因。');
    record.referral={date:TODAY,hospital:document.getElementById('referral-hospital').value,department:document.getElementById('referral-dept').value,reason,note:'演示转诊，未发送外部系统'};
    log(record,`创建了转诊单，转诊医院：${record.referral.hospital}，转诊科室：${record.referral.department}`);
    log(record,'更新了跟踪状态为已转诊');
  }
  if(drawer.mode==='closed'){
    const date=document.getElementById('end-date').value;const reason=document.getElementById('end-reason').value;const note=document.getElementById('end-note').value.trim();
    if(!date||date<record.notify.date||date>TODAY)return formError('末次跟踪日期须在告知日期至演示当日之间。');
    if(!reason)return formError('请选择跟踪结束原因。');if(reason==='其他'&&!note)return formError('选择“其他”时，请填写补充描述。');
    record.end={date,reason,note,method:document.getElementById('end-method').value};record.closedDate=date;
    log(record,`更新了跟踪状态为跟踪结束，原因：${reason}`);
  }
  record.status=drawer.mode;persist();closeOverlay();render();toast('已保存，报告进入“'+STATE_LABELS[record.status]+'”');
}
function callModal(id,kind='report'){

function upgradeV30History(){
  db.records.forEach(record=>{
    record.groups.forEach(group=>normalizedReviewGroup(group,record.notify?.date||TODAY));
    record.groups.forEach(group=>{
      const continuing=record.activeGroupIds?.includes(group.id)&&record.status==='following';
      group.source??=continuing?'持续跟踪时设置':'告知时设置';
      group.createdAt??=(continuing?(record.followDate||TODAY):(record.notify?.date||record.report))+' 10:30';
    });
    if(record.historyV30Normalized)return;
    record.history=record.history.filter(item=>item.text!=='同步总检报告，生成 V2.1 检后任务').map(item=>{
      const next={...item,actor:item.actor==='系统'?'AI系统':item.actor};
      if(next.text==='完成分类确认及结果告知'&&record.notify)next.text=`完成告知，告知方式：${record.notify.method}，告知日期：${record.notify.date}`;
      if(next.text==='设置持续跟踪及复查计划')next.text='更新了[跟踪状态]为 持续跟踪';
      if(next.text==='保存转诊单'&&record.referral)next.text=`创建了转诊单，转诊医院：${record.referral.hospital}，转诊科室：${record.referral.department}`;
      if(next.text==='完成跟踪结束')next.text='更新了[跟踪状态]为 跟踪结束';
      return next;
    });
    const has=text=>record.history.some(item=>item.text.includes(text));
    if(record.notify&&record.groups.some(group=>group.items.length)&&!has('完成异常复查设置'))log(record,'完成异常复查设置',record.doctor,record.notify.date+' 10:31');
    if(record.status==='following'&&!has('更新了[跟踪状态]为 持续跟踪'))log(record,'更新了[跟踪状态]为 持续跟踪',record.doctor,(record.followDate||record.notify?.date||TODAY)+' 14:15');

    record.historyV30Normalized=true;
  });

function enrichRoundTwo(){
  db.records.forEach(record=>{
    record.patientLabels??=['责任患者','体检标签（演示）'];
    record.firstFollowDate??=record.followDate;
    if(record.reviewVisits)return;
    record.reviewVisits=[];
    const untouchedSample=record.id==='TJ20260015'&&record.status==='tracking'&&record.history.filter(item=>item.actor!=='AI系统').length===2&&record.notify?.note==='已说明体检报告及后续安排';
    if(!record.notify||!record.groups.some(group=>group.items.some(id=>record.items.find(item=>item.id===id)?.reviewed))&&!untouchedSample)return;
    const earliest=addDays(record.notify.date,1);const latest=record.closedDate||TODAY;if(earliest>latest)return;
    const selected=record.groups.flatMap(group=>group.items);
    const items=record.items.filter(item=>item.reviewed||untouchedSample&&selected.includes(item.id)).map(item=>({itemId:item.id,name:item.name,group:({血糖:'生化',血脂:'生化',影像检查:'B超'})[item.group]||item.group,value:item.value,unit:item.unit,reference:'原报告参考范围（示例）',abnormal:true}));
    if(untouchedSample)items.push({name:'体质指数',group:'一般检查',value:'26.1',unit:'kg/m²',reference:'原报告参考范围（示例）',abnormal:true});
    record.reviewVisits=[{id:'VISIT-'+record.id,date:earliest+' 15:30',diagnosis:'复查就诊记录（虚构展示，不作临床判断）',items}];
    if(untouchedSample&&addDays(earliest,2)<=latest)record.reviewVisits.push({id:'VISIT-'+record.id+'-2',date:addDays(earliest,2)+' 14:38',diagnosis:'复查就诊记录（虚构展示，不作临床判断）',items:structuredClone(items)});
    log(record,'更新了复查详情','AI系统',record.reviewVisits.at(-1).date);
  });
}

function daysBetween(first,second){return Math.round((new Date(second+'T00:00:00Z')-new Date(first+'T00:00:00Z'))/86400000);}

function stackedChart(labels,series,unit='人次'){
  const colors=['#fa454d','#f5b51a','#1989ff'];const totals=labels.map((label,index)=>series.reduce((sum,values)=>sum+(values[index]||0),0));const max=Math.max(1,...totals);const plotWidth=320;const step=plotWidth/labels.length;
  return `${chartLegend()}<svg class="stats-svg" viewBox="0 0 380 240" role="img" aria-label="${escapeHTML(labels.join('、'))}分布"><text x="14" y="18" class="axis-label">${unit}</text>${[0,1,2,3,4].map(tick=>{const value=max*tick/4;const ordinate=195-tick*40;return `<line x1="38" y1="${ordinate}" x2="360" y2="${ordinate}" stroke="#eef1f6"/><text x="29" y="${ordinate+4}" text-anchor="end" class="axis-label">${Number(value.toFixed(1))}</text>`;}).join('')}${labels.map((label,index)=>{let bottom=195;return series.map((values,categoryIndex)=>{const value=values[index]||0;const height=value/max*160;bottom-=height;return `<rect x="${38+index*step+step*.3}" y="${bottom}" width="${step*.4}" height="${height}" fill="${colors[categoryIndex]}"><title>${label} ${['A','B','C'][categoryIndex]}类：${value}${unit}</title></rect>`;}).join('')+`<text x="${38+(index+.5)*step}" y="219" text-anchor="middle" class="axis-label">${label}</text>`;}).join('')}</svg>`;
}

function itemHasReview(record,id){
  const upper=record.closedDate||addDays(record.report,365);
  return record.items.find(item=>item.id===id)?.reviewed||(record.reviewVisits||[]).some(visit=>record.notify&&!visit.medicationOnly&&visit.date.slice(0,10)>=record.notify.date&&visit.date.slice(0,10)<=upper&&visit.items.some(item=>item.itemId===id));
}
function callSubject(context){if(context.kind==='unexamined')return db.unexamined.find(patient=>patient.id===context.id);if(context.kind==='recall')return findRecord(db.recalls.find(entry=>entry.id===context.id).recordId);return findRecord(context.id);}

function reviewPlanProgress(record,group){
  if(group.cancelled)return {label:'已取消',kind:'neutral'};
  const completed=group.items.filter(id=>itemHasReview(record,id)).length;
  if(completed===group.items.length)return {label:'已复查',kind:'closed'};
  if(completed>0)return {label:'部分已复查',kind:'following'};
  if(group.date&&group.date<TODAY)return {label:'已逾期',kind:'pending'};
  if(group.date&&daysBetween(TODAY,group.date)<=7)return {label:'临近到期',kind:'B'};
  return {label:'待复查',kind:'tracking'};
}

function reviewPlansMarkup(record){
  const groups=record.groups.filter(group=>group.items.length).sort((first,second)=>(second.createdAt||'').localeCompare(first.createdAt||''));
  if(!groups.length)return '<div class="empty">未设置异常复查计划</div>';
  return `<div class="plan-list">${groups.map(group=>{const progress=reviewPlanProgress(record,group);return `<article class="plan-card"><div class="plan-card-head"><div><div class="plan-card-title"><strong>${escapeHTML(group.source||'异常复查设置')}</strong></div><div class="plan-card-meta"><span>创建时间：${escapeHTML(group.createdAt||'—')}</span><span>复查日期：${escapeHTML(group.date||'未设置')}</span>${group.needsAssistant===false?'<span>无需医助通知</span>':`<span>请提醒：${escapeHTML(group.assistant||'未设置')}</span>`}</div></div>${textBadge(progress.label,progress.kind)}</div><div class="plan-items">${group.items.map(id=>{const item=record.items.find(entry=>entry.id===id);if(!item)return '';const reviewed=itemHasReview(record,id);return `<div class="plan-item"><span>${escapeHTML(item.name)}</span>${textBadge(reviewed?'已复查':'待复查',reviewed?'closed':'tracking')}</div>`;}).join('')}</div></article>`;}).join('')}</div>`;
}

function detailTabsList(record){
  const tabs=[['report','体检异常']];
  if(record.status!=='pending'&&record.groups.some(group=>group.items.length))tabs.push(['plans','复查计划']);
  if(record.status==='referred')tabs.push(['visits','就诊记录'],['referral','转诊单']);
  else if(record.status==='following'||record.notify&&record.groups.some(group=>group.items.some(id=>itemHasReview(record,id))))tabs.push(['follow','复查详情']);
  tabs.push(['calls','拨号记录'],['history','操作历史']);
  return tabs;
}

function reviewSelectionMarkup(record,ids,groupIndex){const selected=ids.map(id=>({id,name:record.items.find(item=>item.id===id)?.name})).filter(item=>item.name);if(!selected.length)return '<span class="review-summary-text">请选择异常检验检查项目</span>';return `<span class="review-selection-chips">${selected.map(item=>`<span class="review-selection-chip">${escapeHTML(item.name)}<button type="button" data-action="unselect-review-item" data-index="${groupIndex}" data-item="${item.id}" aria-label="移除${escapeHTML(item.name)}">×</button></span>`).join('')}<span class="muted">已选择${selected.length}项</span></span>`;}

  const renderPicker=(group,index)=>{

    return `<details class="multi-select"><summary>${reviewSelectionMarkup(record,group.items,index)}</summary><div class="multi-select-menu">${sections.map(([title,sectionItems])=>sectionItems.length?`<section class="review-section-card">${[...new Set(sectionItems.map(displayGroup))].map(project=>{const projectItems=sectionItems.filter(item=>displayGroup(item)===project);const counts=['A','B','C'].map(category=>[category,projectItems.filter(item=>item.category===category).length]).filter(([,count])=>count);const projectId=`review-project-${index}-${project.replace(/[^\w\u4e00-\u9fa5]/g,'-')}`;return `<div class="review-project-group"><div class="review-project-head"><input type="checkbox" aria-label="选择${escapeHTML(project)}全部异常指标" data-select-project="${index}" data-project="${escapeHTML(project)}" ${projectItems.every(item=>group.items.includes(item.id))?'checked':''}><strong>${escapeHTML(project)}</strong><span class="review-project-type">${title}</span><span class="review-project-counts"><span>共${projectItems.length}个</span>${counts.map(([category,count])=>`<span class="${category}">${category}类${count}个</span>`).join('')}</span><button type="button" class="review-project-toggle" data-action="toggle-review-project" aria-expanded="false" aria-controls="${projectId}" title="展开${escapeHTML(project)}异常指标"><span class="group-chevron">›</span></button></div><div class="review-project-items" id="${projectId}" hidden>${projectItems.map(item=>{const used=groups.some((other,otherIndex)=>otherIndex!==index&&other.items.includes(item.id));return `<label><input type="checkbox" data-group-item="${index}" value="${item.id}" ${group.items.includes(item.id)?'checked':''} ${used?'disabled':''}><span>${escapeHTML(item.name)}</span>${textBadge(item.category+'类',item.category)}</label>`;}).join('')}</div></div>`;}).join('')}</section>`:'').join('')}</div></details>`;
  };
  const title=state.drawer?.type==='inform'?'<h3 class="section-title">异常复查设置</h3>':'';
  return `<div id="review-editor-root">${title}${groups.map((rawGroup,index)=>{
    const group=normalizedReviewGroup(rawGroup,draft.date||TODAY);const custom=group.datePreset==='custom';const assistants=configuredAssistants();
    const assistantFields=`<div class="assistant-dependent" ${group.needsAssistant?'':'hidden'}><div class="form-field"><label class="required" for="review-assistant-${index}">请提醒</label><div class="assistant-field-row"><select id="review-assistant-${index}" data-plan-field="assistant" data-index="${index}"><option value="">${assistants.length?'请选择':'请配置并选择医助'}</option>${assistants.map(name=>`<option ${group.assistant===name?'selected':''}>${escapeHTML(name)}</option>`).join('')}</select><button type="button" data-action="configure-assistant">配置医助</button></div></div><div class="form-field"><label class="required" for="review-lead-${index}">提醒</label><select id="review-lead-${index}" data-plan-field="lead" data-index="${index}">${[1,2,3,4,5,6,7].map(days=>`<option value="${days}" ${group.lead===days?'selected':''}>${days===7?'1周前':days+'天前'}</option>`).join('')}</select></div></div>`;
    return `<div class="review-plan" data-group-index="${index}"><div class="review-plan-head"><h3>复查计划 ${index+1}</h3><button class="icon-button" data-action="delete-group" data-index="${index}" aria-label="删除复查计划 ${index+1}">${icon('trash')}</button></div><div class="form-field"><label>复查项目</label>${renderPicker(group,index)}</div><div class="form-grid review-config"><div class="form-field full"><label for="review-preset-${index}">复查日期</label><div class="review-date-row"><select id="review-preset-${index}" data-plan-field="datePreset" data-index="${index}"><option value="">请选择</option>${[['7d','7天后'],['14d','14天后'],['1m','1个月'],['3m','3个月'],['6m','6个月'],['custom','自定义']].map(([value,label])=>`<option value="${value}" ${group.datePreset===value?'selected':''}>${label}</option>`).join('')}</select><input id="review-date-${index}" data-plan-field="date" data-index="${index}" type="date" min="${draft.date||TODAY}" max="${addDays(record.report,365)}" value="${group.date||''}" ${custom?'':'readonly'}></div></div><div class="form-field full"><label>需要医助通知</label><div class="assistant-choice">${[['true','是'],['false','否']].map(([value,label])=>`<label><input type="radio" name="needs-assistant-${index}" data-needs-assistant="${index}" value="${value}" ${String(group.needsAssistant)===value?'checked':''}>${label}</label>`).join('')}</div></div>${assistantFields}</div></div>`;
  }).join('')}<button data-action="add-group" style="width:100%;border-style:dashed;color:var(--blue);padding:10px;margin-bottom:17px">＋ 添加复查计划</button></div>`;
}
function refreshReviewEditor(focusSelector){
  const root=document.getElementById('review-editor-root');if(!root||!state.drawer?.draft)return;
  const scroller=root.closest('.inform-right-content');const scrollTop=scroller?.scrollTop||0;
  const wrapper=document.createElement('div');wrapper.innerHTML=reviewEditor(findRecord(state.drawer.id),state.drawer.draft);
  root.replaceWith(wrapper.firstElementChild);if(scroller)scroller.scrollTop=scrollTop;
  const focusTarget=document.querySelector(`#review-editor-root ${focusSelector}`);if(focusTarget){focusTarget.scrollIntoView({block:'nearest'});(focusTarget.matches('button,input,select,textarea')?focusTarget:focusTarget.querySelector('button,input,select,textarea'))?.focus();}
}
function refreshReviewPlanDom(index){
  const record=findRecord(state.drawer.id);const groups=state.drawer.draft.groups;
  document.querySelectorAll('.review-plan').forEach((plan,planIndex)=>{
    if(index!==undefined&&planIndex!==index)return;
    const summary=plan.querySelector('.multi-select summary');if(summary)summary.innerHTML=reviewSelectionMarkup(record,groups[planIndex].items,planIndex);
    plan.querySelectorAll('[data-group-item]').forEach(input=>{input.disabled=groups.some((group,groupIndex)=>groupIndex!==planIndex&&group.items.includes(input.value));input.checked=groups[planIndex].items.includes(input.value);});
    plan.querySelectorAll('[data-select-project]').forEach(input=>{const values=[...input.closest('.review-project-group').querySelectorAll('[data-group-item]:not(:disabled)')].map(entry=>entry.value);const chosen=values.filter(value=>groups[planIndex].items.includes(value)).length;input.checked=values.length>0&&chosen===values.length;input.indeterminate=chosen>0&&chosen<values.length;});
  });
}

function informDrawer(){const drawer=state.drawer;const record=findRecord(drawer.id);const draft=drawer.draft;const informDeadline=`<span>告知期限：<strong>${record.due}</strong></span>`;const deadlines=`${informDeadline}<span>跟踪期限：<strong>${trackingDeadline(draft)}</strong></span>`;let body='';if(drawer.step===1)body=`<h3 class="section-title">报告分类判定</h3><div class="report-summary"><span>原类别</span>${textBadge(record.category+'类',record.category)}<span class="push deadline-summary">${informDeadline}</span></div><div class="form-grid"><fieldset class="form-field"><legend>确认报告类别</legend><div class="category-radios">${(record.normal?['C']:['A','B','C']).map(category=>`<label><input type="radio" name="confirm-category" value="${category}" ${category===draft.category?'checked':''}>${category}类</label>`).join('')}</div></fieldset><div class="form-field"><label for="correction-reason">修订原因</label><input id="correction-reason" value="${escapeHTML(draft.reason)}" placeholder="请输入修订原因"><div class="preset-choices compact">${['初判错误修正','复检正常'].map(value=>`<button type="button" data-action="correction-preset" data-result="${value}">${value}</button>`).join('')}</div></div></div><label id="classification-confirmation" class="checkbox" style="margin-top:20px" ${draft.category===record.category?'hidden':''}><input id="classification-confirmed" type="checkbox" ${draft.confirmed?'checked':''}>已核对本次体检报告，确认上述类别</label>`;if(drawer.step===2)body=`<h3 class="section-title">录入告知结果</h3><div class="report-summary"><span>确认类别</span>${textBadge(draft.category+'类',draft.category)}<span class="push deadline-summary">${informDeadline}</span></div><div class="form-grid"><div class="form-field"><label class="required">告知方式</label><div class="choice-radios">${['电话告知','面对面告知'].map(method=>`<label><input type="radio" name="inform-method" value="${method}" ${draft.method===method?'checked':''}>${method}</label>`).join('')}</div></div><div class="form-field"><label for="inform-date" class="required">告知日期</label><input id="inform-date" type="date" value="${draft.date}" min="${record.report}" max="${TODAY}"></div><div class="form-field full"><label for="inform-content">告知内容</label><input id="inform-content" maxlength="200" value="${escapeHTML(draft.note)}" placeholder="请输入告知内容，最多200字"></div></div>`;if(drawer.step===3)body=record.normal?`<div class="report-summary deadline-summary">${deadlines}</div><div class="all-normal" style="margin-top:16px">${icon('check')}体检报告全部指标未见异常<p style="margin-top:7px;font-size:12px">完成告知后自动进入“跟踪结束”，无需设置复查任务。</p></div>`:`<div class="report-summary deadline-summary">${deadlines}</div>${reviewEditor(record,draft)}`;informShell(record,body);}

function reviewPlansMarkup(record){
  const groups=record.groups.filter(group=>group.items.length).sort((a,b)=>(b.date||b.createdAt||'').localeCompare(a.date||a.createdAt||''));
  if(!groups.length)return '<div class="empty">未设置异常复查计划</div>';
  const itemStatus=(group,item)=>{const reviewed=itemHasReview(record,item.id);if(!reviewed)return textBadge(group.cancelled?'已取消':'待复查',group.cancelled?'neutral':'tracking');const normalize=value=>({血糖:'生化',血脂:'生化',影像检查:'B超'})[value]||value;const visit=(record.reviewVisits||[]).filter(entry=>entry.items.some(row=>row.itemId===item.id||row.name===item.name||normalize(row.group)===normalize(item.group))).sort((a,b)=>b.date.localeCompare(a.date))[0];const row=visit?.items.find(entry=>entry.itemId===item.id||entry.name===item.name)||visit?.items.find(entry=>normalize(entry.group)===normalize(item.group));return `<button type="button" class="badge closed plan-review-link" data-action="plan-review-preview" data-id="${record.id}" data-item="${item.id}" ${visit?`data-visit="${visit.id}" data-group="${escapeHTML(row?.group||normalize(item.group))}"`:''} aria-label="查看${escapeHTML(item.name)}原报告"><span>已复查</span><span aria-hidden="true">›</span></button>`;};
  return `<div class="review-timeline drawer-timeline plan-timeline">${groups.map(group=>{const progress=reviewPlanProgress(record,group);const completed=group.items.filter(id=>itemHasReview(record,id)).length;return `<article class="plan-event drawer-timeline-item"><time>${escapeHTML(group.date||'日期未设置')}</time><div class="plan-card ${group.cancelled?'is-cancelled':completed===group.items.length?'is-complete':''}"><div class="plan-card-head"><div><div class="plan-card-title"><strong>复查计划</strong><span class="plan-source">${escapeHTML(group.source||'告知时设置')}</span></div><div class="plan-card-meta"><span>创建时间：${escapeHTML(group.createdAt||'—')}</span>${group.needsAssistant===false?'<span>无需医助通知</span>':`<span>请提醒：${escapeHTML(group.assistant||'未设置')}</span><span>提醒日期：${group.date?addDays(group.date,-group.lead):'未设置'}</span>`}</div></div><span class="plan-card-progress">${textBadge(progress.label,progress.kind)}</span></div><div class="plan-summary"><div><strong>${group.items.length}</strong>复查项目</div><div><strong>${completed}</strong>已复查</div><div><strong>${group.items.length-completed}</strong>${group.cancelled?'取消时未完成':'待复查'}</div></div><div class="plan-items">${group.items.map(id=>{const item=record.items.find(entry=>entry.id===id);if(!item)return '';return `<div class="plan-item"><span class="plan-item-name">${escapeHTML(item.name)} ${textBadge(item.category+'类',item.category)}</span>${itemStatus(group,item)}</div>`;}).join('')}</div></div></article>`;}).join('')}</div>`;
}

function reviewTimeline(record){const upper=record.closedDate||addDays(record.report,365);const visits=(record.reviewVisits||[]).filter(visit=>record.notify&&visit.date.slice(0,10)>=record.notify.date&&visit.date.slice(0,10)<=upper&&!visit.medicationOnly).sort((a,b)=>b.date.localeCompare(a.date));if(!visits.length)return '<div class="empty">暂无复查记录</div>';return `<div class="review-timeline drawer-timeline">${visits.map((visit,index)=>{const sections=[['检验',['血常规','尿常规','生化','大便OB','乙肝表面抗原']],['检查',EXAM_PROJECTS.filter(group=>!['血常规','尿常规','生化','大便OB','乙肝表面抗原'].includes(group))]];const hasResults=sections.some(([,groupNames])=>visit.items.some(item=>groupNames.includes(item.group)));return `<article class="review-event drawer-timeline-item ${hasResults?'':'compact'}"><time>${escapeHTML(visit.date)}</time>${sections.map(([title,groupNames])=>{const rows=visit.items.filter(item=>groupNames.includes(item.group));if(!rows.length)return '';return `<div class="review-event-kind">${icon(title==='检验'?'file':'heart')}<strong>${title}</strong></div><div class="review-event-panel">${[...new Set(rows.map(item=>item.group))].map((group,groupIndex)=>`<details class="legacy-group" ${index===0&&groupIndex===0?'open':''}><summary><span class="group-chevron">›</span><strong>${escapeHTML(group)}</strong><span class="muted">异常 ${rows.filter(item=>item.group===group&&item.abnormal).length} 项</span><button class="preview-button" data-action="review-preview" data-id="${record.id}" data-visit="${visit.id}" data-group="${escapeHTML(group)}">原报告预览</button></summary>${rows.filter(item=>item.group===group).map(item=>`<div class="indicator-line"><span>${escapeHTML(item.name)}：</span><span class="${item.abnormal?'red-text':''}">${escapeHTML(item.value)} ${escapeHTML(item.unit||'')}</span><span class="indicator-reference">（${escapeHTML(item.reference||'原报告结论')}）</span></div>`).join('')}</details>`).join('')}</div>`;}).join('')}<div class="visit-diagnosis">${icon('file')}<strong>诊断内容</strong><span>${escapeHTML(visit.diagnosis||'无')}</span></div></article>`;}).join('')}</div>`;}

function visitRecordsMarkup(record){const visits=(record.referralVisits||[]).filter(visit=>record.referral&&visit.date.slice(0,10)>=record.referral.date&&visit.date.slice(0,10)<=TODAY&&!visit.medicationOnly).sort((a,b)=>b.date.localeCompare(a.date));if(!visits.length)return '<div class="empty">暂无就诊记录</div>';return `<div class="review-timeline drawer-timeline">${visits.map(visit=>`<article class="visit-card drawer-timeline-item"><div class="visit-card-head">${escapeHTML(visit.date)}</div><dl class="visit-facts"><dt>就诊机构</dt><dd>${escapeHTML(visit.institution)}</dd><dt>接诊医生</dt><dd>${escapeHTML(visit.doctor)}</dd><dt>血压值</dt><dd>${escapeHTML(visit.bloodPressure||'无')}</dd><dt>患者主诉</dt><dd>${escapeHTML(visit.complaint||'无')}</dd><dt>现病史</dt><dd>${escapeHTML(visit.presentHistory||'无')}</dd><dt>既往史</dt><dd>${escapeHTML(visit.pastHistory||'无')}</dd><dt>体格检查</dt><dd>${escapeHTML(visit.physicalExam||'无')}</dd><dt>诊断</dt><dd>${escapeHTML(visit.diagnosis||'无')}</dd><dt>用药记录</dt><dd><div class="medication-list">${visit.medications?.length?visit.medications.map(item=>`<span>${escapeHTML(item.name)}　${escapeHTML(item.frequency)}　每次${escapeHTML(item.dose)}${escapeHTML(item.doseUnit)}　发药${escapeHTML(item.dispensed)}${escapeHTML(item.dispensedUnit)}</span>`).join(''):'无'}</div></dd><dt>检验检查</dt><dd>${visit.exams?.length?visit.exams.map(item=>`<div class="exam-order"><span>${escapeHTML(item.name)}</span><button class="link ${item.abnormalCount?'red-text':''}" data-action="visit-exam-preview" data-id="${record.id}" data-visit="${visit.id}" data-exam="${escapeHTML(item.name)}">异常 ${item.abnormalCount} 项</button></div>`).join(''):'无'}</dd></dl></article>`).join('')}</div>`;}

function referralMarkup(record){if(!record.referral)return '<div class="empty">暂无转诊单</div>';const referral=record.referral;return `<dl class="referral-detail"><dt>当前状态</dt><dd><span class="referral-status">${escapeHTML(referral.status||'已转诊')}</span></dd><dt>转诊医院</dt><dd>${escapeHTML(referral.hospital||'—')}</dd><dt>转诊科室</dt><dd>${escapeHTML(referral.department||'—')}</dd><dt>转出日期</dt><dd>${escapeHTML(referral.date||'—')}</dd><dt>诊断内容</dt><dd>${escapeHTML(referral.currentDiagnosis||'无')}</dd><dt>来源</dt><dd>${escapeHTML(referral.source||'主动转诊')}</dd><dt>转诊原因</dt><dd>${escapeHTML(referral.reason||'体检异常')}</dd><dt>转诊类型</dt><dd>${escapeHTML(referral.type||'上转')}</dd><dt>补充描述</dt><dd>${escapeHTML(referral.note||'无')}</dd><dt>体检日期</dt><dd>${record.exam}</dd></dl>${referral.appointmentDate?`<h3 class="subsection-label">预约信息</h3><dl class="referral-detail"><dt>转诊科室</dt><dd>${escapeHTML(referral.department)}</dd><dt>预约日期</dt><dd>${escapeHTML(referral.appointmentDate)}</dd><dt>当前状态</dt><dd>${escapeHTML(referral.status||'已转诊')}</dd></dl>`:''}`;}

function detailTabsList(record){
  const tabs=[];const hasPlans=record.status!=='pending'&&record.groups.some(group=>group.items.length);
  if(record.notify)tabs.push(['follow','复查详情']);
  if(hasPlans)tabs.push(['plans','复查计划']);
  tabs.push(['report','体检异常']);
  if(record.referral)tabs.push(['visits','就诊记录'],['referral','转诊单']);
  tabs.push(['calls','拨号记录'],['history','操作历史']);
  return tabs;
}
function detailSummaryMarkup(record){const deadline=record.notify?`跟踪期限：${record.followDue||'—'}`:`告知期限：${record.due}`;return `<div class="report-section-line drawer-report-summary"><h3><span class="report-category">本体检报告：${textBadge(record.category+'类',record.category)}</span><span class="red-text">${deadline}</span></h3><button class="link" data-action="compare" data-id="${record.id}">3年体检数据详情 ›</button></div>`;}
function detailBodyMarkup(record,current){if(current==='history')return historyMarkup(record);if(current==='calls')return callHistoryMarkup(record);if(current==='plans')return reviewPlansMarkup(record);if(current==='follow')return reviewTimeline(record);if(current==='visits')return visitRecordsMarkup(record);if(current==='referral')return referralMarkup(record);return `${groupedReport(record)}${record.notify?followDescription(record):''}`;}
