lass="primary" id="checkReport">校验并提交</button></div><div class="result" id="reportResult" aria-live="polite"></div>`,'* 必填；强化与探索项目按所选层级填写'):panel('本级审核',`<div class="mini"><span>${state.role==='province'?'省级抽核':'市级复核'}</span><button type="button" class="link" data-review="${state.role}">打开审核队列</button></div>`)}${panel('建设审核情况',`<div class="review-queue"><div class="review-row"><span>机构草稿</span><strong>提交后进入区县初审</strong></div><div class="review-row"><span>区县初审</span><strong>建设事实与附件</strong></div><div class="review-row"><span>市级复核</span><strong>跨区一致性</strong></div><div class="review-row"><span>省级抽核</span><strong>抽样与疑点</strong></div></div>`)}${panel('申报记录',`<div class="table-wrap"><table><thead><tr><th>批次</th><th>区县</th><th>机构</th><th>建成日期</th><th>审核状态</th></tr></thead><tbody>${items||'<tr><td colspan="5">暂无本次演示申报</td></tr>'}</tbody></table></div>`)}`}

function clinicInsight(type){let s=selected(),eligible=sum(s,'should'),built=sum(s,'clinics'),active=sum(s,'active'),title=type==='unused'?'建而未用分析':'建设覆盖分析',result=type==='unused'?`已建成 ${built} 家，其中 ${built-active} 家未识别有效两慢病服务，比例 ${rate(built-active,built)}%。`:`应建设 ${eligible} 家，已建成 ${built} 家，缺口 ${eligible-built} 家。`;drawer(title,`<div class="detail">${esc(regionLabel())} · ${esc(periodText())}</div><div class="drawer-section"><h3>分析结果</h3><p>${result}</p></div><div class="drawer-section"><h3>数据支持</h3><div class="drawer-metrics"><div><small>应建设</small><b>${eligible} 家</b></div><div><small>已建成</small><b>${built} 家</b></div><div><small>有效启用</small><b>${active} 家</b></div><div><small>建而未用</small><b>${built-active} 家</b></div></div></div><div class="drawer-section"><h3>执行建议</h3><p>${state.role==='clinic'?'补齐建设材料，确认门诊实际开诊与系统服务记录。':'将问题机构纳入下级建设计划或运行改进事项，明确责任人和完成期限。'}</p></div><div class="actions">${state.role==='clinic'?'<button class="primary" id="clinicInsightAction">进入建设上报</button>':`<button class="primary" id="clinicInsightAction">${state.role==='province'?'查看省级抽核':'处理本级审核'}</button>`}</div>`);$('clinicInsightAction').onclick=()=>{closeDrawer();if(state.role==='clinic'){state.clinicTab='report';render()}else reviewDrawer(state.role)}}
function bind(){document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{state.page=button.dataset.page;render()});document.querySelectorAll('[data-clinic-tab]').forEach(button=>button.onclick=()=>{state.clinicTab=button.dataset.clinicTab;state.page='clinic';render()});document.querySelectorAll('[data-region]').forEach(button=>button.onclick=()=>regionDetail(button.dataset.region));document.querySelectorAll('[data-region-scope]').forEach(button=>button.onclick=()=>{state.regionScope=button.dataset.regionScope;state.expanded=[];render()});document.querySelectorAll('[data-expand]').forEach(button=>button.onclick=()=>{let key=button.dataset.expand;state.expanded=state.expanded.includes(key)?state.expanded.filter(x=>x!==key):[...state.expanded,key];render()});document.querySelectorAll('[data-level]').forEach(button=>button.onclick=()=>{state.level=button.dataset.level;render()});document.querySelectorAll('[data-metric]').forEach(button=>button.onclick=()=>drawer(button.dataset.metric,`<div class="detail">${esc(metricRules[button.dataset.metric]||'当前显示模拟数据。正式规则需要明确统计对象、分子、分母、统计期和数据来源。')}</div>`));document.querySelectorAll('[data-case]').forEach(button=>button.onclick=()=>{let row=button.closest('tr');drawer(button.dataset.case,`<div class="detail"><p><strong>对象：</strong>${esc(row.cells[0].textContent)}</p><p><strong>异常证据：</strong>${esc(row.cells[1].textContent)}</p><p><strong>数据来源：</strong>${esc(row.cells[2].textContent)}</p><p><strong>责任方：</strong>${esc(row.cells[3].textContent)}</p><p><strong>截止日期：</strong>${esc(row.cells[4].textContent)}</p></div><p class="sub">上级核验后关闭事项；原始业务数据不由上报入口修改。</p>`)});if(state.page==='clinic'&&state.clinicTab==='report'&&$('checkReport'))$('checkReport').onclick=checkReport}
function bindMapControls(){document.querySelectorAll('[data-map-scope]').forEach(button=>button.onclick=()=>{state.mapScope=button.dataset.mapScope;mapZoom=1;document.querySelectorAll('[data-map-scope]').forEach(item=>item.classList.toggle('active',item===button));renderProvinceMap()});document.querySelectorAll('[data-map-view]').forEach(button=>button.onclick=()=>{state.mapView=button.dataset.mapView;mapZoom=1;$('mapStage').querySelector('.map-fallback-notice')?.remove();$('mapStage').classList.toggle('is-3d',state.mapView==='3d');document.querySelectorAll('[data-map-view]').forEach(item=>item.classList.toggle('active',item===button));renderProvinceMap()});document.querySelectorAll('[data-map-metric]').forEach(button=>button.onclick=()=>{state.mapMetric=button.dataset.mapMetric;document.querySelectorAll('[data-map-metric]').forEach(item=>item.classList.toggle('active',item===button));$('mapMetricLabel').textContent=button.firstChild.textContent;renderProvinceMap()});document.querySelectorAll('[data-map-zoom]').forEach(button=>button.onclick=()=>changeMapZoom(button.dataset.mapZoom))}
function bindMapMetricHelp(){document.querySelectorAll('.map-metrics .metric-help').forEach(icon=>{icon.onmouseenter=()=>showMetricTooltip(icon);icon.onmouseleave=()=>hideMetricTooltip(icon);icon.onfocus=()=>showMetricTooltip(icon);icon.onblur=()=>hideMetricTooltip(icon);icon.onclick=event=>event.stopPropagation()})}
function render(){activeHelp=null;metricTooltip.style.visibility='hidden';renderNav();renderOrgPicker();$('year').value=state.year;$('quarter').value=state.quarter;$('month').value=state.month;$('quarterWrap').style.display=state.periodMode==='quarter'?'flex':'none';$('monthWrap').style.display=state.periodMode==='month'?'flex':'none';document.querySelectorAll('#periodSeg button').forEach(button=>button.classList.toggle('active',button.dataset.periodMode===state.periodMode));let needsPeriod=['dashboard','population','service','outcome','governance'].includes(state.page)||state.page==='clinic'&&state.clinicTab==='overview';$('view').innerHTML=!periodHasSample()&&needsPeriod?`<div class="empty-state"><strong>该统计周期暂无演示数据</strong><p>当前原型只配置了 2026 年截至三季度、2026 年三季度及 2026 年 9 月的模拟数据。</p></div>`:pages[state.page]();if(periodHasSample()&&['clinic','service','outcome','governance'].includes(state.page)&&!(state.page==='clinic'&&state.clinicTab==='report')){$('view').insertAdjacentHTML('beforeend',scopeExplorer(state.page))}bind();bindMapControls();bindMapMetricHelp();attachMetricHelp();renderProvinceMap()}
$('month').innerHTML=Array.from({length:9},(_,index)=>`<option value="${index+1}">${index+1} 月</option>`).join('');
$('orgTrigger').onclick=()=>{let open=$('orgPicker').classList.toggle('open');$('orgTrigger').setAttribute('aria-expanded',String(open));if(open){let [level]=state.city.split(':'),chosen=selected()[0];orgBrowseCity=level==='city'?chosen?.name:chosen?.cityName||cities[0].name;orgBrowseCounty=['county','consortium','clinic'].includes(level)?chosen?.county:null;orgBrowseConsortium=['consortium','clinic'].includes(level)?chosen?.consortiumName:null;renderOrgPicker();positionOrgPanel()}};
$('orgPanel').onclick=event=>{let button=event.target.closest('[data-org]');if(!button)return;let value=button.dataset.org,level=value.split(':')[0];if(level==='city'){orgBrowseCity=value.slice(5);orgBrowseCounty=null;orgBrowseConsortium=null}else if(level==='county'){orgBrowseCounty=value.slice(7);orgBrowseConsortium=null}else if(level==='consortium')orgBrowseConsortium=value.slice(11);state.city=value;state.expanded=[];render();if(level==='clinic'||value==='all'){$('orgPicker').classList.remove('open');$('orgTrigger').setAttribute('aria-expanded','false')}else positionOrgPanel()};

const baseCheckReport=checkReport;
checkReport=function(){let errors=[],code=$('code').value.trim(),phone=$('phone').value.trim(),name=$('name').value.trim(),county=$('county').value,date=$('date').value;if(code&&!/^[A-Za-z0-9-]{6,24}$/.test(code))errors.push('机构代码须为6至24位字母、数字或连字符');if(phone&&!/^(1[3-9]\d{9}|0\d{2,3}-?\d{7,8})$/.test(phone))errors.push('联系电话格式不正确');if(date&&date>new Date().toISOString().slice(0,10))errors.push('建成日期不能晚于今天');if(name&&state.submissions.some(x=>x.name===name&&x.county===county))errors.push('当前机构已有演示申报记录');if(errors.length){let box=$('reportResult');box.className='result show bad';box.textContent=errors.join('；');return}baseCheckReport()};
function startClinicAction(type){let issue=type==='unused'?'建而未用门诊整改':'一体化门诊建设缺口整改';drawer('发起整改督办',`<div class="detail">${esc(regionLabel())} · ${esc(issue)}</div><div class="drawer-section"><label class="field">责任单位<input id="actionOwner" placeholder="填写下级责任单位"></label><label class="field">完成期限<input type="date" id="actionDue"></label><label class="field">督办要求<textarea id="actionNote" rows="3" placeholder="填写建设或运行改进要求"></textarea></label><div class="review-action"><button class="primary" id="saveAction">创建演示事项</button></div><div class="result" id="actionResult" aria-live="polite"></div></div>`);$('saveAction').onclick=()=>{let owner=$('actionOwner').value.trim(),due=$('actionDue').value,note=$('actionNote').value.trim();if(!owner||!due||!note){let result=$('actionResult');result.className='result show bad';result.textContent='请填写责任单位、完成期限和督办要求';return}state.actions.unshift({scope:regionLabel(),issue,owner,due,note});closeDrawer();state.page='governance';render()}}
const baseClinicInsight=clinicInsight;
clinicInsight=function(type){baseClinicInsight(type);if(state.role==='clinic')return;let button=$('clinicInsightAction');if(button){button.textContent='发起整改督办';button.onclick=()=>startClinicAction(type)}};

function showPrototypeHelp(){drawer('原型说明',`<div class="detail"><p>所有数值、机构和事项均为模拟内容，不代表浙江省真实情况。市县采用行政区划边界；医共体和基层机构名称为演示占位，正式版须接入机构主数据。</p><p>确诊、专档与风险数据拟通过各地公卫系统接口获取；就诊、检验检查拟接省级数据高铁。只有一体化门诊建设情况允许区县上报，机构仅保存建设草稿。</p><p>人群底数的高危人群指尚未确诊的筛查线索；在管患者的高、中、低风险为另一套演示分层，两者不能相加。当前各页面的智能分析由预设规则和模拟数据生成，未接入 AI 模型；风险阈值、人员负荷标准及真实审核权限仍需确认。</p><p>建设申报按2025年版基本保障、强化功能、鼓励探索三类清单设计。区县初审、市级复核、省级抽核为原型建议流程，不代表政策已规定逐级审批。地图使用阿里云 DataV 的市、区县边界；街道边界尚未接入。</p></div><p class="sub">原型审核与申报仅本地演示，不发送到服务器。</p>`)}
$('help').onclick=showPrototypeHelp;
