name: Deploy Zhejiang dashboard to GitHub Pages
on:
  push:
    branches: [zhejiang-dashboard-demo]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: cp demos/zhejiang-dashboard/demo.html demos/zhejiang-dashboard/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demos/zhejiang-dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
